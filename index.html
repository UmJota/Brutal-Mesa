<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f0b0c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body>
<title>Brutal Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de mesa mobile-first — cabeçalho fixo, conteúdo em cartões empilhados, barra de abas no rodapé. Visual de pôster slasher: preto-sangue, osso, vermelho. */
:root{
  --bg:#0f0b0c; --panel:#1b1416; --panel2:#251b1e; --line:#3a2a2e;
  --bone:#efe5d8; --muted:#a8968f; --blood:#d4142f; --blood-d:#7d0b1c;
  --ok:#6fbf73; --warn:#e3a33b; --killer:#9b6bd6; --fuga:#3fb3c9;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--bone)}
body{font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--bone);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blood);outline-offset:1px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1.05}
h1{font-size:42px}h2{font-size:24px}h3{font-size:18px}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:11px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.killer{background:#3a2550;border-color:var(--killer)}
.btn.ghost{background:transparent}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--panel2)}
.chip.on{background:var(--blood);border-color:var(--blood);color:#fff}
.chip.k{border-color:var(--killer);color:#d7c3f3}
.chip.f{border-color:var(--fuga);color:#bfeaf2}
.chip.w{border-color:var(--warn);color:#f6d79c}
.chip.dead{background:#000;border-color:#555;color:#bbb}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 4px;font-weight:600;font-size:14px}
.seg button.on{background:var(--blood);color:#fff}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(var(--bg) 70%,transparent);}
.top .wrap{padding-block:10px 6px;gap:6px}
.brand{font-family:var(--display);font-size:26px;letter-spacing:.04em;color:var(--blood);line-height:1}
.pools{display:flex;gap:6px;flex-wrap:wrap}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#140e10;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{border:0;background:transparent;padding:10px 2px 12px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--bone)}
.tabs button.on .ic{background:var(--blood)}
.ic{width:26px;height:5px;border-radius:3px;background:var(--line)}
/* dice */
.pile{display:flex;gap:6px;flex-wrap:wrap}
.slot{width:34px;height:34px;border-radius:8px;border:2px dashed var(--line)}
.slot.full{border:2px solid var(--bone);background:var(--bone)}
.slot.fu{border:2px solid var(--fuga);background:var(--fuga)}
.slot.fu.empty{background:transparent;border-style:dashed}
.die{width:46px;height:46px;border-radius:10px;background:var(--bone);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:7px;gap:1px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.die i{border-radius:50%;width:8px;height:8px;place-self:center;background:transparent}
.die i.p{background:#1a1012}
.die.fail{background:#4a3a3d;opacity:.75}.die.fail i.p{background:#cbb}
.die.six{background:var(--blood)} .die.six i.p{background:#fff}
@keyframes tumble{0%{transform:rotate(-30deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.die.anim{animation:tumble .35s ease-out both}
@media (prefers-reduced-motion:reduce){.die.anim{animation:none}}
.big{font-family:var(--display);font-size:56px;line-height:.9}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-size:20px}
.meter{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.meter span{height:12px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.meter span.on{background:var(--warn);border-color:var(--warn)}
.wound{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.wound span{height:14px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.wound span.on{background:var(--blood);border-color:var(--blood)}
.wound.seq span.on{background:#8a4a2a;border-color:#b3653c}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:18px}
.step b{min-width:28px;text-align:center;font-family:var(--mono);font-size:18px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel2)}
.item p{margin:0}
.banner{border:2px solid var(--blood);background:#2a0b11;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.log{font-size:13px;display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}
.log div{border-left:3px solid var(--line);padding-left:8px}
.log div.k{border-color:var(--killer)} .log div.d{border-color:var(--blood)} .log div.m{border-color:var(--warn)}
details{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2)}
details summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0}
.surv{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-top:2px solid var(--blood);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--bone);color:#111;padding:10px 16px;border-radius:999px;font-weight:600;z-index:50;max-width:90vw;text-align:center}
.hero{padding-block:30px 10px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:64px;color:var(--blood)}
.arqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arq{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:2px}
.arq.on{border-color:var(--blood);background:#3a1219}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.pill-dead{color:#bbb;text-decoration:line-through}
hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
</style>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

/* ============ REDE P2P (PeerJS) + BANCO LOCAL ============ */
const PEER_OPTS=window.PEER_OPTS||{debug:0};
const PID=c=>"brutalrpg-mesa-"+c.toLowerCase();
const NET={role:null,peer:null,conns:[],conn:null,code:null,status:"off"};
const store={}; const listeners=new Set(); let notifyQ=false;
const clone=o=>o===undefined?undefined:JSON.parse(JSON.stringify(o));
function merge(a,b){for(const k in b){const v=b[k];if(v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k]))merge(a[k],v);else a[k]=clone(v)}return a}
function notify(){if(notifyQ)return;notifyQ=true;queueMicrotask(()=>{notifyQ=false;listeners.forEach(f=>{try{f()}catch(e){console.warn(e)}})})}
function lsJ(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||"null");localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function localGet(p){return (lsJ("brutal.local")||{})[p]}
function localApply(op){const l=lsJ("brutal.local")||{};if(op.k==="set")l[op.p]=op.d;else if(op.k==="update")l[op.p]=merge(l[op.p]||{},op.d);else delete l[op.p];lsJ("brutal.local",l)}
function applyOp(op){if(op.k==="set")store[op.p]=clone(op.d);else if(op.k==="update")store[op.p]=merge(store[op.p]?store[op.p]:{},op.d);else delete store[op.p]}
function pruneLog(){const ks=Object.keys(store).filter(k=>/^mesas\/[^/]+\/log\//.test(k));if(ks.length>80){ks.sort((a,b)=>(store[a].t||0)-(store[b].t||0));ks.slice(0,ks.length-60).forEach(k=>delete store[k])}}
function persist(){if(NET.role==="host")lsJ("brutal.host."+NET.code,store)}
function broadcast(){NET.conns.forEach(c=>{try{if(c.open)c.send({t:"state",s:store})}catch(e){}})}
async function write(op){
  if(op.p.startsWith("contas/")){localApply(op);return}
  if(NET.role==="client"){if(!NET.conn||!NET.conn.open)throw{code:"offline"};NET.conn.send({t:"op",op});applyOp(op);notify();return}
  applyOp(op);pruneLog();persist();broadcast();notify();
}
function snapOf(p){const d=p.startsWith("contas/")?localGet(p):store[p];return{id:p.split("/").pop(),exists:d!==undefined,data:()=>clone(d),metadata:{}}}
function docRef(p){return{id:p.split("/").pop(),path:p,
  get:async()=>snapOf(p),set:d=>write({k:"set",p,d:clone(d)}),update:d=>write({k:"update",p,d:clone(d)}),delete:()=>write({k:"del",p}),
  onSnapshot(n){const f=()=>n(snapOf(p));listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)},collection:c=>collRef(p+"/"+c)}}
function collRef(p,ord,lim){const depth=p.split("/").length+1;const q={path:p,
  doc:id=>docRef(p+"/"+(id||rid())),add:async d=>{const r=docRef(p+"/"+rid());await r.set(d);return r},
  orderBy:(f,dir)=>collRef(p,[f,dir||"asc"],lim),limit:n=>collRef(p,ord,n),
  _q(){let ds=Object.keys(store).filter(k=>k.startsWith(p+"/")&&k.split("/").length===depth).map(snapOf);
    if(ord)ds.sort((a,b)=>((a.data()[ord[0]]||0)-(b.data()[ord[0]]||0))*(ord[1]==="desc"?-1:1));if(lim)ds=ds.slice(0,lim);return{docs:ds,size:ds.length,empty:!ds.length}},
  get:async()=>q._q(),onSnapshot(n){const f=()=>n(q._q());listeners.add(f);setTimeout(f,0);return()=>listeners.delete(f)}};return q}
function rid(){return Array.from(crypto.getRandomValues(new Uint32Array(3))).map(x=>x.toString(36)).join("")}
const LOCAL_DB={doc:docRef,collection:p=>collRef(p)};
function hosted(){return lsJ("brutal.hosted")||[]}
function addHosted(c){const h=hosted().filter(x=>x!==c);h.unshift(c);lsJ("brutal.hosted",h.slice(0,10))}
function netLeave(){try{NET.peer&&NET.peer.destroy()}catch(e){}NET.role=null;NET.peer=null;NET.conns=[];NET.conn=null;NET.code=null;NET.status="off";for(const k in store)delete store[k]}
function netHost(code){return new Promise((res,rej)=>{
  if(typeof Peer==="undefined")return rej(new Error("Sem internet para abrir a mesa."));
  netLeave();const saved=lsJ("brutal.host."+code)||{};Object.assign(store,saved);
  const peer=new Peer(PID(code),PEER_OPTS);NET.peer=peer;NET.code=code;let ok=false;
  peer.on("open",()=>{ok=true;NET.role="host";NET.status="host";notify();res()});
  peer.on("connection",c=>{NET.conns.push(c);c.on("open",()=>{c.send({t:"state",s:store});render()});
    c.on("data",m=>{if(m&&m.t==="op"&&m.op&&typeof m.op.p==="string"&&m.op.p.startsWith("mesas/"+code)){applyOp(m.op);pruneLog();persist();broadcast();notify()}});
    c.on("close",()=>{NET.conns=NET.conns.filter(x=>x!==c);render()})});
  peer.on("disconnected",()=>{NET.status="reconectando";render();setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
  peer.on("error",e=>{if(!ok){netLeave();rej(e.type==="unavailable-id"?Object.assign(new Error("Essa mesa já está aberta em outro aparelho."),{taken:true}):new Error("Não consegui abrir a mesa ("+e.type+")."))}else console.warn(e)});
})}
function netJoin(code){return new Promise((res,rej)=>{
  if(typeof Peer==="undefined")return rej(new Error("Sem internet para entrar na mesa."));
  netLeave();const peer=new Peer(PEER_OPTS);NET.peer=peer;NET.code=code;NET.role="client";NET.status="conectando";let first=true;
  const fail=m=>{if(first){first=false;netLeave();rej(new Error(m))}};
  const connect=()=>{if(NET.peer!==peer)return;const c=peer.connect(PID(code),{reliable:true});NET.conn=c;
    c.on("open",()=>{NET.status="on";render()});
    c.on("data",m=>{if(m&&m.t==="state"){for(const k in store)delete store[k];Object.assign(store,m.s);notify();if(first){first=false;res()}}});
    c.on("close",()=>{if(NET.peer!==peer)return;NET.status="reconectando";render();setTimeout(connect,3000)})};
  peer.on("open",connect);
  peer.on("error",e=>{if(e.type==="peer-unavailable"){if(first)fail("Mesa fora do ar ou código errado. O aparelho que hospeda precisa estar com a página aberta.");else{NET.status="reconectando";render();setTimeout(connect,4000)}}else if(first)fail("Não consegui conectar ("+e.type+").");else console.warn(e)});
  setTimeout(()=>fail("A mesa não respondeu. Confira o código e se o host está com a página aberta."),15000);
})}

function stopSubs(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[]}
async function abrirMesa(code,silent){
  code=code.trim().toUpperCase(); if(!code)return;
  if(NET.code!==code||!NET.role){ S.conectando=code; render();
    try{ if(hosted().includes(code)){ try{await netHost(code)}catch(e){ if(e.taken) await netJoin(code); else throw e } } else await netJoin(code); }
    catch(e){ S.conectando=null; if(!silent)toast(e.message); else S.aviso=e.message; ls("brutal.mesa",""); S.code=null; return render(); }
    S.conectando=null; }
  const snap=await S.db.doc(P.mesa(code)).get();
  if(!snap.exists){ if(!silent) toast("Mesa não encontrada. Confira o código."); ls("brutal.mesa",""); S.code=null; return render(); }
  stopSubs(); S.code=code; S.mesa=snap.data(); S.membros={}; S.sobrev={}; S.killer=null; S.killerLoaded=false; S.log=[];
  ls("brutal.mesa",code);
  const err=e=>console.warn(e);
  S.unsub.push(S.db.doc(P.mesa(code)).onSnapshot(s=>{if(s.exists){S.mesa=s.data();sync();render()}},err));
  S.unsub.push(S.db.collection(`mesas/${code}/membros`).onSnapshot(q=>{S.membros={};q.docs.forEach(d=>S.membros[d.id]=d.data());render()},err));
  S.unsub.push(S.db.collection(`mesas/${code}/sobrev`).onSnapshot(q=>{S.sobrev={};q.docs.forEach(d=>S.sobrev[d.id]=d.data());sync();render()},err));
  S.unsub.push(S.db.doc(P.killer(code)).onSnapshot(s=>{S.killer=s.exists?s.data():null;S.killerLoaded=true;render()},err));
  S.unsub.push(S.db.collection(`mesas/${code}/log`).orderBy("t","desc").limit(40).onSnapshot(q=>{S.log=q.docs.map(d=>d.data());render()},err));
  // lembrar na conta
  const lista=(S.conta?.mesas||[]).filter(m=>m.code!==code); lista.unshift({code,nome:S.mesa.nome});
  S.conta.mesas=lista.slice(0,8); upd(`contas/${S.uid}`,{mesas:S.conta.mesas}).catch(()=>{});
  S.tab=ls("brutal.tab."+code)||null;
  render();
}

let syncing=false;
async function sync(){
  const s=me(); if(!s||!S.mesa||syncing) return;
  const patch={};
  if(modo()==="encontro"&&s.encId!==encId()){
    patch.encId=encId(); patch.distr=0; patch.escEnc=null; let pilha=s.pilha, fuga=s.fuga||0;
    if(s.status!=="morto"&&pilha<=0){ patch.status="morto"; log(`☠ ${s.nome} começou o Encontro sem dados — Morte Súbita.`,"d"); }
    if(s.flags?.planejar&&pilha>0){ pilha--; fuga++; patch["flags"]={...s.flags,planejar:false}; }
    patch.pilha=pilha; patch.fuga=fuga;
  } else if(modo()!=="encontro"&&(s.fuga||0)>0){
    patch.pilha=clamp(s.pilha+s.fuga,0,6); patch.fuga=0; patch.escEnc=null;
  }
  if(Object.keys(patch).length){ syncing=true; try{await upd(P.sob(S.code,S.uid),patch)}catch(e){} syncing=false; }
}

/* ============ RENDER ============ */
function render(){
  const app=$("#app");
  const ae=document.activeElement;
  if(ae&&ae.dataset&&ae.dataset.live!==undefined&&app.contains(ae)){ S.pending=true; return; }
  S.pending=false;
  const keep={};app.querySelectorAll("form[data-form] [name]").forEach(el=>{if(el.type!=="submit")keep[el.form.dataset.form+"."+el.name]=el.value});
  app.innerHTML=view();
  app.querySelectorAll("form[data-form] [name]").forEach(el=>{const k=el.form.dataset.form+"."+el.name;if(k in keep&&!(el.name==="hab"&&S.draftArqChanged))el.value=keep[k]});S.draftArqChanged=false;
  renderSheet();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending)render()},50));

function view(){
  if(S.fatal) return `<div class="wrap"><div class="hero"><h1>Brutal</h1><p class="muted">Mesa de jogo para Brutal RPG</p></div><div class="card"><p>${esc(S.fatal)}</p></div></div>`;
  if(!S.ready) return `<div class="wrap"><div class="hero"><h1>Brutal</h1><p class="muted">Afiando a faca…</p></div></div>`;
  if(!S.conta||S.renomeando) return viewConta();
  if(!S.code||!S.mesa) return viewHome();
  if(!papel()) return header()+viewLobby();
  return header()+`<main>${viewTab()}</main>`+tabs();
}

function tabList(){
  const p=papel(); const t=[];
  if(p==="sobrevivente") t.push(["ficha","Ficha"]);
  if(p==="killer") t.push(["killer","Killer"]);
  if(p==="mestre"){t.push(["mestre","Mestre"]);t.push(["killer","Killer"]);}
  t.push(["mesa","Mesa"]); t.push(["regras","Regras"]);
  return t;
}
function curTab(){const t=tabList().map(x=>x[0]); return t.includes(S.tab)?S.tab:t[0]}
function tabs(){const c=curTab();return `<div class="tabs"><nav>${tabList().map(([k,n])=>`<button data-act="tab" data-t="${k}" class="${k===c?"on":""}"><span class="ic"></span>${n}</button>`).join("")}</nav></div>`}
function viewTab(){
  const t=curTab();
  if(t==="ficha") return viewFicha();
  if(t==="killer") return viewKiller();
  if(t==="mestre") return viewMestre();
  if(t==="mesa") return viewMesa();
  return viewRegras();
}

function viewFicha(){
  const s=me();
  if(!s||S.draft.criando) return viewCriarSob();
  const A=ARQ[s.arq]; const enc=modo()==="encontro"; const p=pools();
  const susto=S.mesa.susto; const sustoPend=susto&&susto.id&&s.sustoId!==susto.id&&s.status!=="morto"&&!escapou(s);
  const marcs=Object.entries(s.marc||{}).filter(([k,v])=>v>0);
  const dead=s.status==="morto", esc_=escapou(s);
  const habTxt=A.hab.find(h=>h[0]===s.hab);
  let h=`<div class="wrap">`;
  if(sustoPend) h+=`<div class="banner"><h2>Teste de Susto!</h2><p class="small">Role um dado da sua Pilha Comum. Falhou, ele ${susto.sac?"é <b>sacrificado para o Killer</b>":"vai para o <b>Descarte</b>"}.</p><button class="btn primary block" data-act="susto">Rolar o Susto</button></div>`;
  h+=`<section class="card"><div class="row between"><div style="min-width:0"><span class="lbl">${esc(s.arq)} · Iniciativa ${A.ini}</span><h2 class="${dead?"pill-dead":""}">${esc(s.nome)}</h2></div>
   ${dead?`<span class="chip dead">Morta</span>`:esc_?`<span class="chip f">Escapou</span>`:`<span class="chip">Viva</span>`}</div>
   <div class="row between"><span class="lbl">Pilha Comum</span><span class="num"><b>${s.pilha}</b>/6</span></div>${pileHTML(s.pilha)}
   ${enc?`<div class="row between"><span class="lbl">Pilha de Fuga</span><span class="num"><b>${s.fuga||0}</b>/${fugaAlvo()}</span></div>${fugaHTML(s.fuga||0,fugaAlvo())}`:""}
   <div class="row between"><span class="lbl">Pontos de Tensão</span><span class="num"><b>${s.pt}</b>/10</span></div>${meterHTML(s.pt)}
   <div class="grid2"><div><div class="row between"><span class="lbl">Ferida</span><span class="num">${s.ferida}/6</span></div>${woundHTML(s.ferida,6)}</div>
   <div><div class="row between"><span class="lbl">Sequela</span><span class="num">${s.sequela}/5</span></div>${woundHTML(s.sequela,5,"seq")}</div></div>
   <div class="row">${marcs.map(([k,v])=>`<span class="chip w">${MARC_N[k]} ${v}</span>`).join("")}${(s.incap||[]).map(e=>`<span class="chip dead">${e} incapacitado</span>`).join("")}
   ${s.flags?.aquecer?`<span class="chip">Aquecida</span>`:""}${s.flags?.planejar?`<span class="chip f">Fuga planejada</span>`:""}${s.flags?.preparar?`<span class="chip">Preparada p/ o pior</span>`:""}</div>
   <div class="row between"><span class="lbl">Recursos</span><div class="step"><button data-act="sobStep" data-f="recursos" data-d="-1" aria-label="menos recurso">−</button><b>${s.recursos||0}</b><button data-act="sobStep" data-f="recursos" data-d="1" aria-label="mais recurso">+</button></div></div>
  </section>`;
  if(dead){
    h+=`<section class="card"><p>Sua Sobrevivente morreu. Ainda dá para ajudar a mesa no papel de Killer, ou criar outra Sobrevivente.</p><button class="btn block" data-act="novaSob">Criar nova Sobrevivente</button></section>`;
  } else {
    h+=`<section class="card"><button class="btn primary block" style="min-height:56px;font-size:18px" data-act="rolar" data-tipo="teste" ${s.pilha<1?"disabled":""}>Rolar teste</button>
     <p class="small muted">Falhas ${enc?"vão para o <b>Descarte</b> (Encontro)":"são <b>sacrificadas para o Killer</b> ("+(modo()==="suspense"?"Suspense":"Cena Livre")+")"}. Descarte disponível: <b class="num">${p.descarte}</b>.</p></section>`;
    if(enc&&!esc_){
      h+=`<section class="card"><h3>Manobras do Encontro</h3><p class="small muted">Uma por turno. Vantagens ficam travadas no Encontro.</p><div class="grid2">
      <button class="btn" data-act="rolar" data-tipo="vazar">Vazar Dali</button>
      <button class="btn" data-act="rolar" data-tipo="partir">Partir pra Cima</button>
      <button class="btn" data-act="rolar" data-tipo="distrair">Distrair</button>
      <button class="btn" data-act="rolar" data-tipo="ajudar">Ajudar Alguém</button>
      <button class="btn" data-act="folego">Recuperar Fôlego</button>
      <button class="btn" data-act="arriscar" ${s.arriscouSessao===S.mesa.sessao?"disabled":""}>Arriscar Tudo</button></div></section>`;
    }

   <label class="lbl" for="habsel">Trocar habilidade</label><select id="habsel" data-act-change="hab">${A.hab.map(x=>`<option ${x[0]===s.hab?"selected":""}>${esc(x[0])}</option>`).join("")}</select></section>`;
  const ses=S.mesa.sessao||1;
  h+=`<section class="card"><h3>Apegos</h3><div class="list">
   ${apego("item","Item Icônico",s.item,"+2 PT · 1x por sessão",s.usos?.item===ses)}
   ${apego("relacao","Relação Afetiva",s.relacao,"+2 PT · 1x por sessão",s.usos?.relacao===ses)}
   ${apego("desejo","Desejo Obscuro",s.desejo,"+3 PT · só uma vez",!!s.usos?.desejo)}</div></section>`;
  h+=`<section class="card"><h3>Notas</h3><textarea id="notas" data-live data-save="notas" placeholder="Aparência, recursos, pistas…">${esc(s.notas||"")}</textarea></section>`;
  h+=`</div>`;
  return h;
}

/* ---------- KILLER ---------- */

  let h=`<div class="wrap">`;
  if(!souKiller()){
    h+=`<div class="card"><h3>${S.mesa.killer?`Quem joga de Killer agora: ${esc(nick(S.mesa.killer))}`:"Ninguém está com o monstro"}</h3>

    if(!souMestre()) return h+`</div>`;
  }
  if(!k||S.draft.kEdit) return h+viewCriarKiller()+(k?`<button class="btn ghost block" data-act="kCancelEdit">Manter o monstro atual</button>`:"")+`</div>`;
  const st=killerStats(k); const p=pools(); const enc=modo()==="encontro";
  const sustosUsados=(k.sustos&&k.sustos.enc===encId())?k.sustos.n:0;

  h+=`<section class="card"><div class="row between"><div><span class="lbl">${esc(k.amP)} · ${esc(k.amS)}</span><h2>${esc(k.nome)}</h2></div><span class="chip k">NB ${st.tot}</span></div>
   <div class="grid2"><div class="stat"><span class="lbl">Pilha</span><span class="big num">${p.killer}</span></div>
   <div class="stat"><span class="lbl">Pontos de Horror</span><div class="step"><button data-act="ph" data-d="-1" aria-label="menos PH">−</button><span class="big num">${k.ph}</span><button data-act="ph" data-d="1" aria-label="mais PH">+</button></div></div></div>
   <p class="small muted">Dados sacrificados pelas Sobreviventes até agora: <b class="num">${p.sac}</b>. Eles entram sozinhos na sua pilha.</p>
   <div class="grid3"><div class="stat"><span class="lbl">Fuga</span><b>${fugaAlvo()}</b></div><div class="stat"><span class="lbl">Sustos</span><b>${sustosUsados}/${st.sustos}</b></div><div class="stat"><span class="lbl">Armadilhas</span><b>${st.armad}</b></div><div class="stat"><span class="lbl">Passos</span><b>${st.passos}</b></div><div class="stat"><span class="lbl">Distrações</span><b>${distr}</b></div><div class="stat"><span class="lbl">Rodada</span><b>${enc?S.mesa.enc?.rodada||1:"—"}</b></div></div>
   <div class="item"><span class="lbl">Estigma</span><p class="small">${esc(st.est)}</p></div></section>`;
  if(!ctl) return h+`</div>`;

   <button class="btn killer" data-act="kAssustar" ${sustosUsados>=st.sustos?"disabled":""}>Assustar</button>
   <button class="btn killer" data-act="kAlvo" data-a="ferir" ${p.killer<1?"disabled":""}>Ferir</button>
   <button class="btn killer" data-act="kAlvo" data-a="matar" ${!enc?"disabled":""}>Matar</button>
   <button class="btn killer" data-act="kDificultar" ${!enc||k.ph<4?"disabled":""}>Dificultar (4 PH)</button>

   <button class="btn" data-act="kDado" data-d="1">+1 dado</button></div>

function survRows(killerView){
  const list=Object.entries(S.sobrev).sort((a,b)=>(ARQ[a[1].arq]?.ini||9)-(ARQ[b[1].arq]?.ini||9));
  if(!list.length) return `<p class="small muted">Nenhuma Sobrevivente na mesa ainda. Passe o código <b class="num">${esc(S.code)}</b>.</p>`;
  const kp=pools().killer;
  return list.map(([u,s])=>{
    const dead=s.status==="morto",e=escapou(s);
    const marcs=Object.entries(s.marc||{}).filter(([k,v])=>v>0).map(([k,v])=>`<span class="chip w">${MARC_N[k]} ${v}</span>`).join("");
    return `<div class="item"><div class="surv"><div style="min-width:0"><b class="${dead?"pill-dead":""}">${esc(s.nome)}</b> <span class="small muted">${esc(s.arq)} · ${esc(s.apelido||nick(u))}</span></div>
     ${dead?`<span class="chip dead">Morta</span>`:e?`<span class="chip f">Escapou</span>`:killerView&&s.pilha<kp&&modo()==="encontro"?`<span class="chip on">Matável</span>`:`<span class="chip">Viva</span>`}</div>
     <div class="row small"><span class="chip">Dados <b class="num">${s.pilha}</b></span>${modo()==="encontro"?`<span class="chip f">Fuga ${s.fuga||0}/${fugaAlvo()}</span>`:""}<span class="chip">Ferida ${s.ferida}</span><span class="chip">Sequela ${s.sequela}</span><span class="chip">PT ${s.pt}</span>${marcs}</div>
     ${souMestre()?`<button class="btn sm" data-act="editSob" data-u="${u}">Ajustar</button>`:""}</div>`}).join("");
}

  const R=[
   ["Testes","Diga quantos dados da Pilha Comum arrisca e role todos. Dificuldade padrão 4: cada dado ≥ Dificuldade é sucesso. Usar um dos seus Estilos ou um Recurso reduz 1. Comum pede 1 sucesso; Complexo pede 2 sucessos ou um 6. Cada sucesso a mais dá 1 PT."],
   ["Perdendo dados","Falhas sempre saem da pilha. Em Cena Livre e Suspense são SACRIFICADAS (vão para o Killer). No Encontro e no Teste de Susto são DESCARTADAS (vão para o Descarte). Recuperar dado = puxar do Descarte. Máximo 6 na Pilha Comum."],
   ["Teste de Susto","Role 1 dado. Falhou, ele vai para o Descarte."],
   ["Pontos de Tensão","Começa com 0, máximo 10. Ganha com Desafios, apegos e sucessos extras. Compra Vantagens fora do Encontro."],
   ["Encontro","Começa quando o Killer tem mais dados que alguém. Quem começa com 0 dados morre (Morte Súbita). Iniciativa fixa por Arquétipo; o Killer age por último. Para escapar, complete a Pilha de Fuga (maior NB + 1). No fim, a Fuga volta para a Pilha Comum."],
   ["Manobras","Vazar Dali (Ligeiro): sucessos vão para a Fuga; cada 6 puxa +1 dado. Partir pra Cima (Potente): 1 sucesso faz o Killer descartar 1 dado. Distrair (Desenrolado, Complexo): Matar passa a custar +1 dado e 3 PH. Ajudar Alguém: sucessos viram dados de outra; falhas não se perdem. Recuperar Fôlego: +1 dado do Descarte. Arriscar Tudo: descarte todos os seus dados e alguém escapa (1x por sessão)."],
   ["Ferida e Sequela","Ferir: 6 mata; 1–5 vira Ferida (soma) e +1 Sequela. Ferida 6 mata. Sequelas vão até 5 e definem o mínimo de Ferida ao tratar."],
   ["Encerrando o Encontro","Killer Escapa (+1 dado), Killer fica sem dados, todas escapam, ou todas morrem."],
   ["Assassino","NB total = dados iniciais. NB da Primária = PH iniciais. Maior NB + 1 = Pilha de Fuga. 4 − maior NB = Passos. 7 − NB total = Sustos por Encontro e Armadilhas iniciais."]
  ];
  return `<div class="wrap"><section class="card"><h2>Regras rápidas</h2><div class="list">${R.map(r=>`<details><summary>${r[0]}</summary><p class="small">${r[1]}</p></details>`).join("")}</div></section>

}

/* ============ SHEETS ============ */
function openSheet(o){S.sheet=o;renderSheet()}
function closeSheet(){S.sheet=null;renderSheet()}
function renderSheet(){
  const el=$("#sheet"); const o=S.sheet;
  if(!o){el.innerHTML="";return}
  if(el.contains(document.activeElement)&&document.activeElement.tagName==="INPUT") return;
  el.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${sheetBody(o)}</div></div>`;
}
function sheetBody(o){
  const s=me();
  if(o.kind==="roll"){
    const r=o.res;
    const nomes={teste:"Teste",vazar:"Vazar Dali",partir:"Partir pra Cima",distrair:"Distrair",ajudar:"Ajudar Alguém"};
    if(r) return `<h2>${nomes[o.tipo]}</h2><div class="row">${r.dice.map((v,i)=>dieHTML(v,(v>=r.diff?(v===6?"six":""):"fail")+" anim")).join("")}</div>
      <p><b>${r.ok?"Sucesso":"Falhou"}</b> · ${r.succ} sucesso(s) com Dificuldade ${r.diff}${r.cx?" (Complexo)":""}.</p><div class="list small">${r.msgs.map(m=>`<div>• ${m}</div>`).join("")}</div>
      <button class="btn primary block" data-act="closeSheet">Ok</button>`;
    const A=ARQ[s.arq]; const outros=vivos().filter(([u])=>u!==S.uid);
    const est=o.estilo; const own=A.est.includes(est)&&!(s.incap||[]).includes(est);
    const dif=calcDif(o);
    return `<h2>${nomes[o.tipo]}</h2>
     <span class="lbl">Estilo</span><div class="row">${["",...ESTILOS].map(e=>`<button class="chip ${o.estilo===e?"on":""}" data-act="rs" data-k="estilo" data-v="${e}">${e||"Nenhum"}${A.est.includes(e)?" ★":""}</button>`).join("")}</div>
     ${o.tipo==="teste"?`<div class="row"><button class="chip ${o.cx?"on":""}" data-act="rs" data-k="cx" data-v="${o.cx?"":"1"}">Teste Complexo</button></div>`:""}
     <div class="row"><button class="chip ${o.rec?"on":""}" data-act="rs" data-k="rec" data-v="${o.rec?"":"1"}" ${(s.recursos||0)<1?"disabled":""}>Usar Recurso (−1) · ${s.recursos||0}</button></div>
     ${o.tipo==="ajudar"?`<label class="lbl" for="alvoA">Ajudar quem</label><select id="alvoA" data-act-change="rsAlvo">${outros.map(([u,x])=>`<option value="${u}" ${o.alvo===u?"selected":""}>${esc(x.nome)} (${x.pilha} dados)</option>`).join("")}</select>`:""}
     <div class="row between"><span class="lbl">Dados arriscados</span><div class="step"><button data-act="rs" data-k="n" data-v="${Math.max(1,o.n-1)}" aria-label="menos dados">−</button><b>${o.n}</b><button data-act="rs" data-k="n" data-v="${Math.min(s.pilha,o.n+1)}" aria-label="mais dados">+</button></div></div>
     <div class="row">${pileHTML(o.n,s.pilha)}</div>
     <p class="small muted">Dificuldade <b>${dif.d}</b>${dif.cx?" · Complexo":""}${own?" · Estilo seu (−1)":""}${dif.notes.length?" · "+dif.notes.join(" · "):""}</p>
     <button class="btn primary block" data-act="doRoll" ${(o.tipo==="ajudar"&&!outros.length)||s.pilha<1?"disabled":""}>Rolar ${o.n} dado${o.n>1?"s":""}</button>
     <button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="susto"){
    const r=o.res;
    return `<h2>Teste de Susto</h2>${r?`<div class="row">${dieHTML(r.v,(r.v>=4?(r.v===6?"six":""):"fail")+" anim")}</div><p><b>${r.v>=4?"Manteve a compostura.":"Perdeu a compostura."}</b> ${r.msg}</p>
      ${r.v<4&&r.podeRepetir?`<button class="btn block" data-act="sustoRepetir">Repetir (Benefício da Dúvida)</button>`:""}<button class="btn primary block" data-act="closeSheet">Ok</button>`:""}`;
  }
  if(o.kind==="tratar"){
    const max=Math.min(s.pt,s.ferida-s.sequela);
    return `<h2>Tratar Feridas</h2><p class="small">Cada PT reduz 1 de Ferida, até o mínimo de ${s.sequela} (suas Sequelas).</p>
     <div class="row between"><span>PT a gastar</span><div class="step"><button data-act="tsN" data-v="${Math.max(0,(o.n||0)-1)}">−</button><b>${o.n||0}</b><button data-act="tsN" data-v="${Math.min(max,(o.n||0)+1)}">+</button></div></div>
     <button class="btn primary block" data-act="tratarOk" ${!(o.n>0)?"disabled":""}>Tratar ${o.n||0} de Ferida</button>
     <button class="btn block" data-act="curarSeq" ${(s.recursos||0)<1||s.sequela<1?"disabled":""}>Curar 1 Sequela com Recurso</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="compartilhar"){
    const outros=vivos().filter(([u])=>u!==S.uid);
    return `<h2>Compartilhar Forças</h2><label class="lbl" for="cpA">Para quem</label><select id="cpA" data-act-change="cpAlvo">${outros.map(([u,x])=>`<option value="${u}" ${o.alvo===u?"selected":""}>${esc(x.nome)} (${x.pt} PT)</option>`).join("")}</select>
     <div class="row between"><span>PT</span><div class="step"><button data-act="cpN" data-v="${Math.max(0,(o.n||0)-1)}">−</button><b>${o.n||0}</b><button data-act="cpN" data-v="${Math.min(s.pt,(o.n||0)+1)}">+</button></div></div>
     <button class="btn primary block" data-act="cpOk" ${!(o.n>0)||!o.alvo?"disabled":""}>Transferir</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="tomar"){
    return `<h2>Tomar Jeito</h2><p class="small">Qual Estilo recuperar?</p><div class="list">${(s.incap||[]).map(e=>`<button class="btn" data-act="tomarOk" data-e="${e}">${e}</button>`).join("")}</div><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="arriscar"){
    const outros=vivos().filter(([u,x])=>!escapou(x));
    const ateFim=s.hab==="Até o Fim", herói=s.hab==="Sacrifício Heroico", final=s.hab==="Final Girl";
    return `<h2>Arriscar Tudo</h2><p class="small">Você descarta todos os seus dados e a escolhida escapa na hora. 1x por sessão, uma por Encontro, e não vale se você for a última na cena.</p>
     <label class="lbl" for="arA">Quem escapa</label><select id="arA" data-act-change="arAlvo">${outros.map(([u,x])=>`<option value="${u}" ${o.alvo===u?"selected":""}>${esc(x.nome)}${u===S.uid?" (você)":""}</option>`).join("")}</select>
     ${ateFim?`<p class="small">Até o Fim: se for você, mantém 1 dado.</p>`:""}${herói?`<p class="small">Sacrifício Heroico: salvando outra, descarta só metade.</p>`:""}${final?`<p class="small">Final Girl: se for a última, não descarta nada.</p>`:""}
     <button class="btn primary block" data-act="arOk">Arriscar Tudo</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="kAlvo"){
    const kp=pools().killer; const enc=modo()==="encontro";
    const alvos=vivos().filter(([u,x])=>!escapou(x));
    const r=o.res;
    if(r) return `<h2>${o.a==="ferir"?"Ferir":"Matar"}</h2>${r.v?`<div class="row">${dieHTML(r.v,(r.v===6?"six":"")+" anim")}</div>`:""}<p>${r.msg}</p>
      ${r.mutilar?`<div class="grid2"><button class="btn killer" data-act="kSeis" data-o="matar">Matar</button><button class="btn" data-act="kSeis" data-o="mutilar">Mutilar (+4 PH)</button></div>`:`<button class="btn primary block" data-act="closeSheet">Ok</button>`}`;
    return `<h2>${o.a==="ferir"?"Ferir":"Matar"}</h2><div class="list">${alvos.map(([u,x])=>{const pode=o.a==="ferir"||x.pilha<kp;return `<button class="btn" style="justify-content:space-between" data-act="kGo" data-u="${u}" ${pode?"":"disabled"}><span>${esc(x.nome)}</span><span class="small muted">${x.pilha} dados · Ferida ${x.ferida}</span></button>`}).join("")||`<p class="muted">Ninguém ao alcance.</p>`}</div><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="kUnica"){
    const A=ACOES_U[o.a]; const alvos=vivos();
    return `<h2>${o.a}</h2><p class="small">${A.d}</p>${(A.marc||A.incap)?`<span class="lbl">Em quem</span><div class="list">${alvos.map(([u,x])=>`<button class="btn ${o.alvo===u?"killer":""}" data-act="kuAlvo" data-u="${u}">${esc(x.nome)}</button>`).join("")}</div>`:""}
     ${A.incap&&o.alvo?`<span class="lbl">Estilo</span><div class="row">${ESTILOS.map(e=>`<button class="chip ${o.est===e?"on":""}" data-act="kuEst" data-e="${e}">${e}</button>`).join("")}</div>`:""}
     <button class="btn killer block" data-act="kuOk" ${((A.marc||A.incap)&&!o.alvo)||(A.incap&&!o.est)?"disabled":""}>Usar ${A.c?`(−${A.c} PH)`:""}</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="editSob"){
    const x=S.sobrev[o.u]; if(!x) return `<button class="btn block" data-act="closeSheet">Fechar</button>`;
    const st=(f,lab,max)=>`<div class="row between"><span>${lab}</span><div class="step"><button data-act="mStep" data-u="${o.u}" data-f="${f}" data-d="-1" data-max="${max}">−</button><b>${f.includes(".")?(x.marc?.[f.split(".")[1]]||0):(x[f]||0)}</b><button data-act="mStep" data-u="${o.u}" data-f="${f}" data-d="1" data-max="${max}">+</button></div></div>`;
    return `<h2>${esc(x.nome)}</h2><div class="list">${st("pilha","Pilha Comum",6)}${st("fuga","Pilha de Fuga",9)}${st("pt","PT",10)}${st("ferida","Ferida",6)}${st("sequela","Sequela",5)}${st("recursos","Recursos",9)}
     ${Object.keys(MARC_N).map(k=>st("marc."+k,MARC_N[k],6)).join("")}</div>
     <span class="lbl">Estilos incapacitados</span><div class="row">${ESTILOS.map(e=>`<button class="chip ${(x.incap||[]).includes(e)?"on":""}" data-act="mIncap" data-u="${o.u}" data-e="${e}">${e}</button>`).join("")}</div>
     <p class="small muted">Ajustes do Mestre não mexem nas pilhas do Killer nem do Descarte.</p>
     <div class="grid2"><button class="btn" data-act="mStatus" data-u="${o.u}">${x.status==="morto"?"Reviver":"Matar"}</button><button class="btn primary" data-act="closeSheet">Pronto</button></div>`;
  }
  return "";
}
function calcDif(o){
  const s=me(),A=ARQ[s.arq]; let d=4, cx=!!o.cx; const notes=[];
  if(o.estilo&&A.est.includes(o.estilo)&&!(s.incap||[]).includes(o.estilo)) d--;
  if(o.rec) d--;
  const amP=S.killer?.amP;
  if(o.tipo==="partir"&&amP==="Máquina"){d++;notes.push("Além da Carne +1")}
  if(o.tipo==="partir"&&amP==="Desconhecido"){cx=true;notes.push("Não Euclidiano")}
  if(o.tipo==="vazar"&&amP==="Perseguidor"&&s.ferida>3){d++;notes.push("Rastro de Sangue +1")}
  if(o.tipo==="distrair") cx=true;
  if((s.marc?.condenacao||0)>0){cx=true;notes.push("Condenação")}
  return {d:clamp(d,2,6),cx,notes};
}

async function doRoll(){
  const o=S.sheet,s=me(); const n=Math.min(o.n,s.pilha); if(n<1)return;
  const {d,cx}=calcDif(o); const dice=roll(n);
  let succ=dice.filter(v=>v>=d).length; const sixes=dice.filter(v=>v===6).length;
  const msgs=[]; const patch={}; const enc=modo()==="encontro";
  if(o.tipo==="partir"&&s.flags?.aquecer){succ++;patch.flags={...s.flags,aquecer:false};msgs.push("Aquecer: +1 sucesso garantido.")}
  const ok=cx?(succ>=2||sixes>0&&succ>=1):succ>=1;
  const fails=n-Math.min(succ,n);
  if(o.rec){patch.recursos=s.recursos-1;msgs.push("Recurso gasto.")}
  let pilha=s.pilha;
  const perder=(q)=>{ if(q<=0)return; pilha-=q;
    if(enc){patch.desc=(s.desc||0)+q;msgs.push(`${q} dado(s) <b>descartado(s)</b>.`)}
    else {patch.sac=(s.sac||0)+q;msgs.push(`${q} dado(s) <b>sacrificado(s) para ${esc(S.killer?.nome||"o Killer")}</b>${S.mesa.killer?` (com ${esc(nick(S.mesa.killer))})`:""}.`)}
    if((s.marc?.possessao||0)>0){const pv=Math.min(6,s.marc.possessao+q);patch.marc={...s.marc,possessao:pv};msgs.push(`Possessão subiu para ${pv}.`);if(pv>=6)log(`👁 A Possessão de ${s.nome} chegou a 6!`,"k")}
  };
  if(o.tipo==="teste"){
    perder(fails);
    let extra=Math.max(0,succ-(cx?2:1));
    if(s.hab==="Egocêntrica"&&sixes){extra+=2*sixes;msgs.push(`Egocêntrica: +${2*sixes} PT pelos 6.`)}
    if(extra){patch.pt=clamp(s.pt+extra,0,10);msgs.push(`+${extra} PT.`)}
    log(`${s.nome} rolou ${n} (${dice.join(", ")}) ${o.estilo||""}: ${ok?"sucesso":"falha"}.`);
  } else if(o.tipo==="vazar"){
    let fuga=s.fuga||0; pilha-=n; fuga+=Math.min(succ,n); if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} dado(s) descartado(s).`)}
    let extraRec=0,extra=0; for(let i=0;i<sixes;i++){ if(pilha>0){pilha--;fuga++;extra++} else if(pools().descarte-extraRec>0){extraRec++;fuga++;extra++} }
    if(sixes)msgs.push(extra?`Fuga vantajosa: +${extra} dado(s) extra para a Fuga.`:`Fuga vantajosa, mas não havia dado na Pilha nem no Descarte para puxar.`);
    if(extraRec)patch.rec=(s.rec||0)+extraRec;
    patch.fuga=fuga; msgs.push(`Fuga: ${fuga}/${fugaAlvo()}.`);
    if(fuga>=fugaAlvo()){patch.escEnc=encId();msgs.push("<b>Você escapou do Encontro!</b>");log(`🏃 ${s.nome} escapou do Encontro!`)}
    else log(`${s.nome} tentou vazar dali: Fuga ${fuga}/${fugaAlvo()}.`);
  } else if(o.tipo==="partir"){
    pilha-=fails; if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} dado(s) descartado(s).`)}
    if(ok){patch.forc=(s.forc||0)+1;msgs.push("O Killer descarta 1 dado!");log(`💥 ${s.nome} partiu pra cima: o Killer perdeu 1 dado.`,"d")}
    else log(`${s.nome} partiu pra cima e não conseguiu nada.`);
  } else if(o.tipo==="distrair"){
    pilha-=fails; if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} dado(s) descartado(s).`)}
    if(ok){patch.distr=(s.distr||0)+1;msgs.push("Distraído! Matar agora custa +1 dado e 3 PH.");log(`${s.nome} distraiu o Killer.`)}
  } else if(o.tipo==="ajudar"){
    const t=S.sobrev[o.alvo]; const give=Math.min(succ,n,6-t.pilha);
    pilha-=give; if(give){await upd(P.sob(S.code,o.alvo),{pilha:t.pilha+give});}
    msgs.push(`${give} dado(s) doado(s) para ${esc(t.nome)}. Falhas não se perdem.`); log(`${s.nome} ajudou ${t.nome} com ${give} dado(s).`);
  }
  patch.pilha=pilha;
  await upd(P.sob(S.code,S.uid),patch);
  o.res={dice,diff:d,succ:Math.min(succ,n+1),ok,cx,msgs}; renderSheet();
}
async function doSusto(repetindo){
  const s=me(); const m=S.mesa;
  if(s.pilha<1){await upd(P.sob(S.code,S.uid),{sustoId:m.susto.id});openSheet({kind:"susto",res:{v:1,msg:"Sem dados para rolar.",podeRepetir:false}});return}
  const v=d6(); const patch={sustoId:m.susto.id}; let msg=""; let pilha=s.pilha;
  if(repetindo){ // devolve o dado perdido na rolagem anterior
    const prev=S.sheet?.res; if(prev&&prev.v<4){ if(prev.sac)patch.sac=(s.sac||0)-1; else patch.desc=(s.desc||0)-1; pilha++; }
  }
  if(v<4){patch.pilha=pilha-1; if(m.susto.sac){patch.sac=(patch.sac??s.sac??0)+1;msg="O dado foi sacrificado para o Killer."} else {patch.desc=(patch.desc??s.desc??0)+1;msg="O dado foi para o Descarte."}
    log(`😱 ${s.nome} falhou no Susto (${v}).`,"d")} else {msg="Nenhum dado perdido.";patch.pilha=pilha;log(`${s.nome} segurou o Susto (${v}).`)}
  await upd(P.sob(S.code,S.uid),patch);
  openSheet({kind:"susto",res:{v,msg,sac:m.susto.sac,podeRepetir:!repetindo&&s.hab==="Benefício da Dúvida"}});
}
async function vantagem(id){
  const s=me(),v=VANT[id]; const cost=id==="choque"&&s.hab?.startsWith("Tensão Aliviada")?5:v.c;
  if(id==="tratar") return openSheet({kind:"tratar",n:0});
  if(id==="compartilhar"){const o=vivos().filter(([u])=>u!==S.uid);return openSheet({kind:"compartilhar",n:0,alvo:o[0]?.[0]})}
  if(id==="tomar"){if(!(s.incap||[]).length)return toast("Nenhum Estilo incapacitado.");return openSheet({kind:"tomar"})}
  if(s.pt<cost) return toast("PT insuficiente.");
  const patch={pt:s.pt-cost};
  if(id==="choque"){if(pools().descarte<1)return toast("O Descarte está vazio.");if(s.pilha>=6)return toast("Pilha cheia.");patch.pilha=s.pilha+1;patch.rec=(s.rec||0)+1}
  if(id==="cacar") patch.recursos=(s.recursos||0)+1;
  if(id==="aquecer") patch.flags={...(s.flags||{}),aquecer:true};
  if(id==="planejar") patch.flags={...(s.flags||{}),planejar:true};
  if(id==="preparar") patch.flags={...(s.flags||{}),preparar:true};
  await upd(P.sob(S.code,S.uid),patch); log(`${s.nome} usou ${v.n}.`); toast(v.n);
}
async function arriscarTudo(){
  const s=me(),o=S.sheet,alvo=o.alvo||S.uid,t=S.sobrev[alvo];
  const naCena=vivos().filter(([u,x])=>!escapou(x));
  let manter=0; if(alvo===S.uid&&s.hab==="Até o Fim")manter=1;
  let perde=s.pilha+(s.fuga||0)-manter;
  if(alvo!==S.uid&&s.hab==="Sacrifício Heroico")perde=Math.ceil(perde/2);
  if(s.hab==="Final Girl"&&naCena.length===1)perde=0;
  const patch={pilha:s.pilha+(s.fuga||0)-perde,fuga:0,desc:(s.desc||0)+perde,arriscouSessao:S.mesa.sessao||1};
  if(alvo===S.uid)patch.escEnc=encId();
  await upd(P.sob(S.code,S.uid),patch);
  if(alvo!==S.uid) await upd(P.sob(S.code,alvo),{escEnc:encId()});
  log(`🔥 ${s.nome} arriscou tudo: ${t.nome} escapou! (${perde} dado(s) descartado(s))`,"d"); closeSheet();
}
async function killerGo(u){
  const o=S.sheet,k=S.killer,t=S.sobrev[u];o.u=u;
  if(o.a==="matar"){
    const distr=Object.values(S.sobrev).reduce((a,s)=>a+(s.encId===encId()?(s.distr||0):0),0);
    let custo=2+distr; if(k.apavoro==="Já Sofreu o Suficiente!"&&t.pilha<3)custo=1+distr; const ph=3*distr;
    if(pools().killer<custo) {o.res={msg:`Precisa de ${custo} dados.`};return renderSheet()}
    if(k.ph<ph){o.res={msg:`As Distrações exigem ${ph} PH.`};return renderSheet()}
    await upd(P.killer(S.code),{base:(k.base||0)-custo,desc:(k.desc||0)+custo,ph:k.ph-ph});
    await upd(P.sob(S.code,u),{status:"morto"}); log(`☠ ${k.nome} matou ${t.nome}.`,"d");
    o.res={msg:`${esc(t.nome)} está morta. ${custo} dado(s) foram para o Descarte.`};return renderSheet();
  }
  // ferir
  if(pools().killer<1){o.res={msg:"Sem dados para Ferir."};return renderSheet()}
  const v=d6(); o.v=v;
  if(v===6){o.res={v,msg:`Tirou 6 em ${esc(t.nome)}. Matar ou Mutilar?`,mutilar:true};return renderSheet()}
  let val=v; const extras=[];
  if(t.flags?.preparar){val=Math.max(0,val-1);extras.push("Preparada para o Pior: −1")}
  if(k.amP==="Brutamontes"&&t.sequela>0){val++;extras.push("Banho de Sangue: +1")}
  const fer=t.ferida+val, seq=Math.min(5,t.sequela+1);
  const patch={ferida:Math.min(6,fer),sequela:seq,flags:{...(t.flags||{}),preparar:false}};
  if(fer>=6)patch.status="morto";
  await upd(P.killer(S.code),{base:(k.base||0)-1});
  await upd(P.sob(S.code,u),patch);
  log(fer>=6?`☠ ${k.nome} feriu ${t.nome} até a morte (${v}).`:`🩸 ${k.nome} feriu ${t.nome}: Ferida ${fer}, Sequela ${seq}.`,"d");
  o.res={v,msg:`${esc(t.nome)}: Ferida ${Math.min(6,fer)}, Sequela ${seq}${extras.length?" ("+extras.join(", ")+")":""}.${fer>=6?" <b>Morreu.</b>":""} O dado virou o Dado Marcador dela.`};renderSheet();
}
async function killerSeis(op){
  const o=S.sheet,k=S.killer,t=S.sobrev[o.u];
  await upd(P.killer(S.code),{base:(k.base||0)-1,desc:(k.desc||0)+1,ph:k.ph+(op==="mutilar"?4:0)});
  if(op==="matar"){await upd(P.sob(S.code,o.u),{status:"morto"});log(`☠ ${k.nome} matou ${t.nome} com um 6.`,"d");o.res={v:6,msg:`${esc(t.nome)} morreu.`}}
  else{const seq=Math.min(5,t.sequela+3);await upd(P.sob(S.code,o.u),{sequela:seq,ferida:Math.max(t.ferida,seq)});log(`🪓 ${k.nome} mutilou ${t.nome}: +3 Sequelas. Uma última chance de correr…`,"d");o.res={v:6,msg:`${esc(t.nome)} foi mutilada (Sequela ${seq}). +4 PH.`}}
  renderSheet();
}
async function killerUnica(){
  const o=S.sheet,k=S.killer,A=ACOES_U[o.a];
  const patch={ph:k.ph-A.c+(A.ph||0)}; await upd(P.killer(S.code),patch);
  if(A.marc&&o.alvo){const t=S.sobrev[o.alvo];let v=A.marc[1];if(k.amP==="Amaldiçoado")v++;await upd(P.sob(S.code,o.alvo),{marc:{...(t.marc||{}),[A.marc[0]]:Math.min(6,v)}});log(`${k.nome} usou ${o.a} em ${t.nome}.`,"k")}
  else if(A.incap&&o.alvo){const t=S.sobrev[o.alvo];const l=t.incap||[];await upd(P.sob(S.code,o.alvo),{incap:l.includes(o.est)?l:[...l,o.est]});log(`${k.nome} incapacitou ${o.est} de ${t.nome}.`,"k")}
  else log(`${k.nome} usou ${o.a}.`,"k");
  closeSheet();
}
