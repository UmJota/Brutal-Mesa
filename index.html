<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0f0b0c">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head><body>
<title>Brutal Mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: app de mesa mobile-first. Faixa de cena colorida no topo, cartão de status, botões grandes da ação do momento, sub-abas para o resto, barra de abas fixa no rodapé. Visual de pôster slasher. */
:root{
  --bg:#0e0a0b; --panel:#1a1315; --panel2:#241a1d; --line:#35262a; --line2:#4a353a;
  --bone:#f1e7da; --muted:#a39189; --dim:#6f5f59;
  --blood:#d6152f; --blood-d:#6e0a18; --blood-bg:#2b0b11;
  --amber:#e9a53a; --amber-bg:#2b1f0b; --slate:#8fa3b0; --slate-bg:#141a1e;
  --ok:#5fbf74; --killer:#a77be0; --killer-bg:#21152f; --fuga:#3fb7cc; --fuga-bg:#0c2329; --pt:#f2c14e;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--bone);overflow-x:hidden;max-width:100%;overscroll-behavior-x:none}
body{touch-action:pan-y;position:relative}
#app,#sheet{max-width:100vw;overflow-x:hidden}
.sheet{touch-action:pan-y;overscroll-behavior:contain}
body{font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:var(--bone);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 20px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance;line-height:1}
h1{font-size:64px;color:var(--blood)} h2{font-size:28px} h3{font-size:19px;letter-spacing:.04em}
p{margin:0}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line2);background:var(--panel2);border-radius:12px;padding:12px 16px;font-weight:700;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.killer{background:var(--killer-bg);border-color:var(--killer);color:#e6d8fa}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.xl{min-height:64px;font-size:20px;font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-weight:400}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.block{width:100%}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.pill.k{border-color:var(--killer);color:#e0cff7;background:var(--killer-bg)}
.pill.f{border-color:var(--fuga);color:#c4eef6;background:var(--fuga-bg)}
.pill.w{border-color:var(--amber);color:#f6d79c;background:var(--amber-bg)}
.pill.r{border-color:var(--blood);color:#ffd3d9;background:var(--blood-bg)}
.pill.dead{background:#000;border-color:#555;color:#bbb}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.w{background:var(--amber)}
/* header + faixa de cena */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:8px;gap:8px}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--blood);line-height:1}
.scene{display:flex;align-items:center;gap:10px;border-radius:12px;padding:9px 12px;border:1px solid}
.scene b{font-family:var(--display);font-weight:400;font-size:clamp(16px,5vw,20px);white-space:nowrap;letter-spacing:.05em;text-transform:uppercase;line-height:1}
.scene span{font-size:13px}
.scene.livre{background:var(--slate-bg);border-color:#2c3a43;color:#d3e0e8}
.scene.suspense{background:var(--amber-bg);border-color:var(--amber);color:#f8e2b8}
.scene.encontro{background:var(--blood-bg);border-color:var(--blood);color:#ffdfe3}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(214,21,47,.25)}}
.scene.encontro{animation:pulse 2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.scene.encontro{animation:none}}
/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#120d0e;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.tabs button{padding:9px 2px 11px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button.on{color:var(--bone)} .tabs button.on svg{color:var(--blood)}
.sub{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.sub button{border-radius:9px;padding:10px 4px;font-weight:700;font-size:14px;color:var(--muted)}
.sub button.on{background:var(--panel2);color:var(--bone);box-shadow:inset 0 0 0 1px var(--line2)}
/* dados */
.dice{display:flex;gap:6px;flex-wrap:wrap}
.d{width:38px;height:38px;border-radius:9px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:6px;background:var(--bone);box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.d i{width:6px;height:6px;border-radius:50%;place-self:center}
.d i.p{background:#1a1012}
.d.empty{background:transparent;border:2px dashed var(--line2);box-shadow:none}
.d.fu{background:var(--fuga)} .d.fu i.p{background:#062026}
.d.lg{width:54px;height:54px;padding:9px;border-radius:12px} .d.lg i{width:9px;height:9px}
.d.fail{background:#3d3033} .d.fail i.p{background:#a99}
.d.six{background:var(--blood)} .d.six i.p{background:#fff}
.d.pick{cursor:pointer}
.d.sel{outline:3px solid var(--blood);outline-offset:2px}
@keyframes tumble{0%{transform:rotate(-40deg) scale(.5);opacity:0}100%{transform:none;opacity:1}}
.d.anim{animation:tumble .4s cubic-bezier(.2,1.4,.4,1) both}
@media (prefers-reduced-motion:reduce){.d.anim{animation:none}}
/* status */
.who{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.st .v{font-family:var(--display);font-size:30px;line-height:1;display:flex;align-items:baseline;gap:3px}
.st .v small{font-family:var(--mono);font-size:13px;color:var(--muted)}
.stats[data-tight] .lbl{letter-spacing:.04em;font-size:10px}
.st.pt .v{color:var(--pt)} .st.fe .v{color:#ff6b7f} .st.se .v{color:#e09a6a}
.bar{height:8px;border-radius:99px;background:#0c0809;overflow:hidden}
.bar span{display:block;height:100%;border-radius:99px}
.bar.pt span{background:var(--pt)} .bar.fe span{background:var(--blood)} .bar.se span{background:#b3653c} .bar.fu span{background:var(--fuga)}
.fuga{background:var(--fuga-bg);border:1px solid var(--fuga);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
/* ações */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:96px}
.act svg.i{width:28px;height:28px;color:var(--blood)}
.act b{font-size:16px;line-height:1.1}
.act span{font-size:12px;color:var(--muted);line-height:1.25}
.act.k svg.i{color:var(--killer)}
.act.go{border-color:var(--blood);background:var(--blood-bg)}
.act[disabled]{opacity:.35;cursor:not-allowed}
/* listas */
.list{display:flex;flex-direction:column;gap:8px}
.line{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-width:0}
.line .grow{flex:1;min-width:0}
.line .grow b{display:block}
.line .grow span{font-size:13px;color:var(--muted)}
.cost{font-family:var(--mono);font-weight:700;font-size:14px;color:var(--pt);min-width:44px;text-align:right}
.cost.k{color:var(--killer)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);font-weight:700;font-size:20px}
.step b{min-width:30px;text-align:center;font-family:var(--mono);font-size:20px}
.banner{border:2px solid var(--blood);background:var(--blood-bg);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.note{border-left:3px solid var(--line2);padding:4px 0 4px 10px;font-size:14px;color:var(--muted)}
.log{font-size:14px;display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
.log div{border-left:3px solid var(--line2);padding-left:9px}
.log div.k{border-color:var(--killer)} .log div.d{border-color:var(--blood)} .log div.m{border-color:var(--amber)}
details{border:1px solid var(--line);border-radius:14px;background:var(--panel)}
details>summary{cursor:pointer;font-weight:700;padding:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:22px;color:var(--muted);line-height:1}
details[open]>summary::after{content:"–"}
details>.in{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.mini{display:flex;gap:3px}
.mini i{width:10px;height:10px;border-radius:3px;background:var(--bone)}
.mini i.e{background:transparent;border:1px solid var(--line2)}
.dead-name{color:#888;text-decoration:line-through}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--panel);border-top:3px solid var(--blood);border-radius:20px 20px 0 0;width:100%;max-width:620px;max-height:90vh;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.target{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.target .n{font-family:var(--display);font-size:44px;line-height:1;color:var(--bone);min-width:52px;text-align:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px}
.chip.on{background:var(--blood);border-color:var(--blood);color:#fff}
.chip.own{border-color:#7a3a45}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.tog .sw{width:46px;height:28px;border-radius:99px;background:#0c0809;border:1px solid var(--line2);position:relative;flex:none}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--dim);transition:left .15s}
.tog.on .sw{background:var(--blood);border-color:var(--blood)} .tog.on .sw::after{left:21px;background:#fff}
.tog[disabled]{opacity:.4}
.verdict{font-family:var(--display);font-size:46px;line-height:1;letter-spacing:.03em;text-transform:uppercase}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--blood)}
.conseq{display:flex;flex-direction:column;gap:8px}
.conseq div{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:9px 12px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--bone);color:#111;padding:11px 18px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.hero{padding-block:36px 8px;display:flex;flex-direction:column;gap:8px}
.arqs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.arq{border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:2px}
.arq.on{border-color:var(--blood);background:var(--blood-bg)}
.lobbies{display:grid;gap:10px}
.lobby{display:flex;gap:14px;align-items:center;text-align:left;padding:16px;border-radius:16px;border:1px solid var(--line2);background:var(--panel2)}
.lobby svg.i{width:34px;height:34px}
.lobby b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.04em;text-transform:uppercase;display:block;line-height:1}
.lobby span{font-size:13px;color:var(--muted)}
.lobby[disabled]{opacity:.4}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.25em;font-weight:700}
.big{font-family:var(--display);font-size:64px;line-height:.9}
</style>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============ DADOS DO SISTEMA (Brutal RPG 0.1 + fichas) ============ */
const ESTILOS=["Desenrolado","Firme","Ligeiro","Potente","Sagaz"];
const ESTILO_DESC={Desenrolado:"Reagir à surpresa, encarar situações incômodas, colaborar no caos.",Firme:"Resistir a eventos danosos, manter-se estável, impor sua vontade.",Ligeiro:"Acrobacias, passar despercebida, enganar — social ou na fuga.",Potente:"Manobras brutais, intimidar, quebrar barreiras com os punhos.",Sagaz:"Resolver problemas mirabolantes, desatar complexidades, persuadir."};
const ARQ={
 "Heroína":{ini:1,est:["Potente","Sagaz"],van:["cacar","aquecer"],lema:"Vim salvar o dia!",hab:[

  ["Até o Fim","Encontro","Ao Arriscar Tudo para se salvar, mantenha um único dado na Pilha Comum em vez de descartar todos."],
  ["Companheirismo","Encontro · início de sessão","1x por sessão, ao Ajudar Alguém, os dados doados vão direto para a Pilha de Fuga da aliada."],
  ["Farol","Suspense","Se ao menos uma Sobrevivente está no mesmo Caminho que você, todas no Caminho têm Dificuldade −1."],
  ["Sacrifício Heroico","Encontro","Ao Arriscar Tudo para salvar outra Sobrevivente, descarte só metade dos seus dados."],
  ["Pedra no Sapato (Cicatriz)","Encontro","Após escapar, continue na Iniciativa com sua Pilha de Fuga e use o turno para mover 1 dado dela para a Pilha Comum de outra Sobrevivente."]]},
 "Atleta":{ini:2,est:["Ligeiro","Potente"],van:["planejar","aquecer"],lema:"Sou forte, ok?",hab:[
  ["Adrenalina","Sem restrição · início de cena","1x por cena, ignore os efeitos de um Clamor Maldito."],
  ["Coach de Equipe","Encontro","Ao escapar, escolha uma Sobrevivente na cena para mover 1 dado da Pilha Comum dela para a Pilha de Fuga."],
  ["Home Run","Encontro","1x por Encontro, compre uma Vantagem com seus PTs."],
  ["Resiliência","Sem restrição · fim de encontro","1x por Encontro, substitua o resultado de uma rolagem sua pelo valor de um dos seus Dados Marcadores."],

 "Valentona":{ini:3,est:["Firme","Potente"],van:["planejar","aquecer"],lema:"Ninguém mexe comigo!",hab:[

 "Esbelta":{ini:4,est:["Desenrolado","Firme"],van:["compartilhar","preparar"],lema:"Sou gostosa demais para morrer!",hab:[

 "Nerd":{ini:6,est:["Ligeiro","Sagaz"],van:["cacar","planejar"],lema:"Não sou muito boa de briga!",hab:[

  setTimeout(()=>fail("A mesa não respondeu. Confira o código e se o host está com a página aberta."),15000);
})}

async function upd(path,obj){try{await S.db.doc(path).update(obj)}catch(e){console.warn(e);toast(e.code==="offline"?"Sem conexão com a mesa. Tentando reconectar…":"Não salvou, tente de novo.");throw e}}

function pools(){
  let sac=0,forc=0,desc=0,rec=0;
  for(const s of Object.values(S.sobrev)){sac+=s.sac||0;forc+=s.forc||0;desc+=s.desc||0;rec+=s.rec||0}
  const k=S.killer||{},m=S.mesa||{};
  return {killer:(k.base||0)+(m.killerAjuste||0)+sac-forc, descarte:desc+forc+(k.desc||0)+(m.descAjuste||0)-rec-(k.rec||0), sac};
}
function modo(){return S.mesa?.modo||"livre"}
function encId(){return S.mesa?.enc?.id||0}
function fugaAlvo(){const st=S.killer&&killerStats(S.killer);return (st?st.fuga:4)+(S.mesa?.enc?.fugaExtra||0)}
function escapou(s){return modo()==="encontro"&&s.escEnc===encId()}
function vivos(){return Object.entries(S.sobrev).filter(([u,s])=>s.status!=="morto")}

async function boot(){
  render();
  S.db=LOCAL_DB; let id=ls("brutal.uid"); if(!id){id="u"+rid();ls("brutal.uid",id)} S.uid=id;
  const c=await S.db.doc(`contas/${S.uid}`).get();
  S.conta=c.exists?c.data():null;
  S.ready=true;
  const last=ls("brutal.mesa");
  if(S.conta&&last){ await abrirMesa(last,true) } else render();
}
boot();

function stopSubs(){S.unsub.forEach(f=>{try{f()}catch(e){}});S.unsub=[]}
async function abrirMesa(code,silent){
  code=code.trim().toUpperCase(); if(!code)return;
  if(NET.code!==code||!NET.role){ S.conectando=code; render();
    try{ if(hosted().includes(code)){ try{await netHost(code)}catch(e){ if(e.taken) await netJoin(code); else throw e } } else await netJoin(code); }
    catch(e){ S.conectando=null; if(!silent)toast(e.message); else S.aviso=e.message; ls("brutal.mesa",""); S.code=null; return render(); }
    S.conectando=null; }
  const snap=await S.db.doc(P.mesa(code)).get();
  if(!snap.exists){ if(!silent) toast("Mesa não encontrada. Confira o código."); ls("brutal.mesa",""); S.code=null; return render(); }
  stopSubs(); S.code=code; S.mesa=snap.data(); S.membros={}; S.sobrev={}; S.killer=null; S.killerLoaded=false; S.log=[];
  ls("brutal.mesa",code);
  const err=e=>console.warn(e);
  S.unsub.push(S.db.doc(P.mesa(code)).onSnapshot(s=>{if(s.exists){S.mesa=s.data();sync();render()}},err));
  S.unsub.push(S.db.collection(`mesas/${code}/membros`).onSnapshot(q=>{S.membros={};q.docs.forEach(d=>S.membros[d.id]=d.data());render()},err));
  S.unsub.push(S.db.collection(`mesas/${code}/sobrev`).onSnapshot(q=>{S.sobrev={};q.docs.forEach(d=>S.sobrev[d.id]=d.data());sync();render()},err));
  S.unsub.push(S.db.doc(P.killer(code)).onSnapshot(s=>{S.killer=s.exists?s.data():null;S.killerLoaded=true;render()},err));
  S.unsub.push(S.db.collection(`mesas/${code}/log`).orderBy("t","desc").limit(40).onSnapshot(q=>{S.log=q.docs.map(d=>d.data());render()},err));
  // lembrar na conta
  const lista=(S.conta?.mesas||[]).filter(m=>m.code!==code); lista.unshift({code,nome:S.mesa.nome});
  S.conta.mesas=lista.slice(0,8); upd(`contas/${S.uid}`,{mesas:S.conta.mesas}).catch(()=>{});
  S.tab=ls("brutal.tab."+code)||null;
  render();
}
function sairMesa(){stopSubs();netLeave();S.code=null;S.mesa=null;ls("brutal.mesa","");render()}

/* Sincroniza automações da própria Sobrevivente (início/fim de Encontro) */
let syncing=false;
async function sync(){
  const s=me(); if(!s||!S.mesa||syncing) return;
  const patch={};
  if(modo()==="encontro"&&s.encId!==encId()){
    patch.encId=encId(); patch.distr=0; patch.escEnc=null; let pilha=s.pilha, fuga=s.fuga||0;
    if(s.status!=="morto"&&pilha<=0){ patch.status="morto"; log(`☠ ${s.nome} começou o Encontro sem dados — Morte Súbita.`,"d"); }
    if(s.flags?.planejar&&pilha>0){ pilha--; fuga++; patch["flags"]={...s.flags,planejar:false}; }
    patch.pilha=pilha; patch.fuga=fuga;
  } else if(modo()!=="encontro"&&(s.fuga||0)>0){
    patch.pilha=clamp(s.pilha+s.fuga,0,6); patch.fuga=0; patch.escEnc=null;
  }
  if(Object.keys(patch).length){ syncing=true; try{await upd(P.sob(S.code,S.uid),patch)}catch(e){} syncing=false; }
}

  const y=window.scrollY;

function painel(){
  const p=pools(),md=modo(),enc=md==="encontro",k=S.killer;
  const list=Object.entries(S.sobrev).sort((a,b)=>(ARQ[a[1].arq]?.ini||9)-(ARQ[b[1].arq]?.ini||9));
  const vivas=list.filter(([u,s])=>s.status!=="morto"&&!escapou(s)).length, mortas=list.filter(([u,s])=>s.status==="morto").length, fug=list.filter(([u,s])=>escapou(s)).length;
  const sem=new Set(Object.keys(S.membros).filter(u=>S.membros[u].papel==="sobrevivente"&&!S.sobrev[u]));
  let h=`<section class="card"><div class="stats" style="grid-template-columns:repeat(4,1fr)" data-tight>
    <div class="st"><span class="lbl">Vivas</span><span class="v">${vivas}</span></div>
    <div class="st"><span class="lbl">Mortas</span><span class="v" style="color:#ff6b7f">${mortas}</span></div>
    <div class="st"><span class="lbl">Fugiram</span><span class="v" style="color:var(--fuga)">${fug}</span></div>
    <div class="st"><span class="lbl">Descarte</span><span class="v">${p.descarte}</span></div></div>
   <div class="line" style="border-color:var(--killer);background:var(--killer-bg)">${ic("mask")}<div class="grow"><b>${esc(k?.nome||"Sem monstro")}</b><span>${S.mesa.killer?"com "+esc(nick(S.mesa.killer)):"ninguém no assento"}</span></div><div style="text-align:right"><b class="num" style="font-size:22px">${p.killer}</b><span class="tiny muted"> dados</span><br><span class="tiny muted">${k?.ph??0} PH</span></div></div></section>`;
  if(!list.length) h+=`<section class="card"><p class="small muted">Nenhuma ficha criada ainda. Mande o código <b class="num">${esc(S.code)}</b> para a galera.</p></section>`;
  h+=list.map(([u,s])=>{
    const dead=s.status==="morto",e=escapou(s),mat=enc&&!dead&&!e&&s.pilha<p.killer;
    const marcs=Object.entries(s.marc||{}).filter(([x,v])=>v>0);
    return `<button class="card" data-act="editSob" data-u="${u}" style="text-align:left;width:100%;${dead?"opacity:.55;":""}${mat?"border-color:var(--blood);":""}${e?"border-color:var(--fuga);":""}">
     <div class="who" style="width:100%"><div style="min-width:0"><h3 class="${dead?"dead-name":""}">${esc(s.nome)}</h3><span class="tiny muted">${esc(s.arq)} · ${esc(s.apelido||nick(u))}${enc?` · ${ARQ[s.arq].ini}º`:""}</span></div>
      ${dead?`<span class="pill dead">${ic("skull")} Morta</span>`:e?`<span class="pill f">Fugiu</span>`:mat?`<span class="pill r">Matável</span>`:`<span class="pill">Viva</span>`}</div>
     <div class="row between" style="width:100%">${diceRow(s.pilha,6,"")}<b class="num">${s.pilha}</b></div>
     ${enc&&!dead?`<div style="width:100%"><div class="row between"><span class="lbl" style="color:#9fdbe6">Fuga</span><span class="num tiny">${s.fuga||0}/${fugaAlvo()}</span></div>${bar(s.fuga||0,fugaAlvo(),"fu")}</div>`:""}
     <div class="stats" style="width:100%">
      <div class="st pt"><span class="lbl">PT</span><span class="v" style="font-size:22px">${s.pt}</span>${bar(s.pt,10,"pt")}</div>
      <div class="st fe"><span class="lbl">Ferida</span><span class="v" style="font-size:22px">${s.ferida}</span>${bar(s.ferida,6,"fe")}</div>
      <div class="st se"><span class="lbl">Sequela</span><span class="v" style="font-size:22px">${s.sequela}</span>${bar(s.sequela,5,"se")}</div></div>
     ${(marcs.length||(s.incap||[]).length||s.recursos)?`<div class="row">${marcs.map(([x,v])=>`<span class="pill w">${MARC_N[x]} ${v}</span>`).join("")}${(s.incap||[]).map(x=>`<span class="pill dead">${x} travado</span>`).join("")}${s.recursos?`<span class="pill">${s.recursos} recurso(s)</span>`:""}</div>`:""}
    </button>`}).join("");
  if(sem.size) h+=`<p class="tiny muted">Ainda criando ficha: ${[...sem].map(u=>esc(nick(u))).join(", ")}</p>`;
  return h;
}

/* ---------- MESA ---------- */
function viewMesa(){
  const host=NET.role==="host";
  return `<div class="wrap"><section class="card"><span class="lbl">Código da mesa</span><span class="code">${esc(S.code)}</span>
   <button class="btn primary block" data-act="convite">${ic("copy")} Copiar convite para o grupo</button>
   ${host?`<p class="note">Este aparelho é o host: deixe esta página aberta. ${NET.conns.filter(c=>c.open).length} conectado(s).</p>`:""}
   <p class="tiny muted">Mestre: <b>${esc(nick(S.mesa.mestre))}</b> · Monstro: <b>${S.mesa.killer?esc(nick(S.mesa.killer)):"ninguém"}</b></p></section>
  ${modo()==="encontro"?`<section class="card"><span class="lbl">Ordem do Encontro</span><div class="list">${Object.entries(S.sobrev).sort((a,b)=>ARQ[a[1].arq].ini-ARQ[b[1].arq].ini).map(([u,s])=>`<div class="row between"><span class="${s.status==="morto"?"dead-name":""}"><b class="num">${ARQ[s.arq].ini}</b> ${esc(s.nome)}</span>${escapou(s)?`<span class="pill f">fugiu</span>`:""}</div>`).join("")}<div class="row"><b class="num">9</b> ${esc(S.killer?.nome||"O Assassino")}</div></div></section>`:""}
  <section class="card"><span class="lbl">Sobreviventes</span><div class="list">${survRows(false)}</div></section>
  <section class="card"><span class="lbl">O que aconteceu</span><div class="log">${S.log.map(l=>`<div class="${esc(l.k)}">${esc(l.txt)}</div>`).join("")||`<span class="muted small">Nada… ainda.</span>`}</div></section>
  <div class="row"><button class="btn sm" data-act="trocarLobby">Trocar de papel</button><button class="btn sm ghost" data-act="sair">Sair da mesa</button></div></div>`;
}

/* ---------- REGRAS ---------- */
function viewRegras(){
  const R=[
   ["Como rolar","Escolha quantos dados arriscar. Cada dado com 4 ou mais é sucesso. Um Estilo seu ou um Recurso baixa a meta em 1. Teste Complexo pede 2 sucessos ou um 6. Cada sucesso a mais dá 1 PT."],
   ["Para onde vão as falhas","Cena Livre e Suspense: para o Killer. Encontro e Susto: para o Descarte. Recuperar um dado é puxar do Descarte. Máximo de 6 na sua pilha."],
   ["Teste de Susto","Role 1 dado. Falhou, perdeu ele."],
   ["Pontos de Tensão","Começa com 0, máximo 10. Ganhe em desafios, apegos e sucessos extras. Gaste em Vantagens fora do Encontro."],
   ["Encontro","O Killer pode atacar quando tem mais dados que alguém. Quem entra com 0 dados morre. Ordem fixa por arquétipo; o Killer age por último. Encha a Pilha de Fuga para escapar."],
   ["Manobras","Vazar Dali: sucessos vão para a Fuga, cada 6 puxa +1. Partir pra Cima: 1 sucesso tira 1 dado do Killer. Distrair (Complexo): Matar custa +1 dado e 3 PH. Ajudar: seus sucessos viram dados de outra. Fôlego: +1 dado do Descarte. Arriscar Tudo: perde todos os dados e alguém escapa (1x por sessão)."],
   ["Ferida e Sequela","Ferir: 6 mata; 1 a 5 vira Ferida (soma) e +1 Sequela. Ferida 6 mata. Sequela vai até 5 e é o mínimo de Ferida ao tratar."],
   ["Fim do Encontro","Killer Escapa (+1 dado), Killer sem dados, todas fugiram ou todas morreram."],
   ["Montando o Killer","Soma dos NB = dados iniciais. NB da principal = PH iniciais. Maior NB + 1 = Fuga. 7 − NB total = Sustos e Armadilhas."]
  ];
  return `<div class="wrap"><h2>Regras rápidas</h2>${R.map(r=>`<details><summary>${r[0]}</summary><div class="in"><p class="small">${r[1]}</p></div></details>`).join("")}
  <details><summary>Estilos</summary><div class="in">${ESTILOS.map(e=>`<p class="small"><b>${e}:</b> ${ESTILO_DESC[e]}</p>`).join("")}</div></details></div>`;
}

/* ============ SHEETS ============ */
function openSheet(o){S.sheet=o;renderSheet()}
function closeSheet(){S.sheet=null;renderSheet()}
function renderSheet(){
  const el=$("#sheet"); const o=S.sheet;
  if(!o){el.innerHTML="";document.body.style.overflow="";return}
  if(el.contains(document.activeElement)&&document.activeElement.tagName==="INPUT") return;
  const sc=el.querySelector(".sheet")?.scrollTop||0;
  el.innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true">${sheetBody(o)}</div></div>`;
  document.body.style.overflow="hidden";
  const sh=el.querySelector(".sheet"); if(sh) sh.scrollTop=sc;
}
const NOMES={teste:"Teste",vazar:"Vazar Dali",partir:"Partir pra Cima",distrair:"Distrair",ajudar:"Ajudar Alguém"};
function sheetBody(o){
  const s=me();
  if(o.kind==="roll"){
    const r=o.res;
    if(r) return `<span class="lbl">${NOMES[o.tipo]}</span><div class="verdict ${r.ok?"ok":"no"}">${r.ok?"Sucesso":"Falhou"}</div>
      <div class="dice">${r.dice.map((v,i)=>dieHTML(v,(v>=r.diff?(v===6?"six":""):"fail")+" anim").replace('class="d','style="animation-delay:'+(i*60)+'ms" class="d')).join("")}</div>
      <p class="small muted">${r.succ} sucesso(s) · precisava de ${r.diff}+${r.cx?" · Complexo":""}</p>
      <div class="conseq">${r.msgs.map(m=>`<div><span>${m}</span></div>`).join("")}</div>
      <button class="btn primary xl block" data-act="closeSheet">Ok</button>`;
    const A=ARQ[s.arq]; const outros=vivos().filter(([u])=>u!==S.uid);
    const dif=calcDif(o);
    const picks=Array.from({length:s.pilha},(_,i)=>`<button class="d lg pick ${i<o.n?"sel":"fail"}" data-act="rs" data-k="n" data-v="${i+1}" aria-label="${i+1} dados">${dieFace(6).replace(/^<span class="d ">|<\/span>$/g,"")}</button>`).join("");
    const ordem=[...A.est,...ESTILOS.filter(e=>!A.est.includes(e))];
    return `<div class="row between"><h2>${NOMES[o.tipo]}</h2><button class="btn ghost sm" data-act="closeSheet">Fechar</button></div>
     <div class="target"><span class="n">${dif.d}+</span><div><b>${dif.cx?"Teste Complexo":"Teste Comum"}</b><br><span class="tiny muted">${dif.cx?"Precisa de 2 sucessos ou um 6":"Precisa de 1 sucesso"}${dif.notes.length?" · "+dif.notes.join(" · "):""}</span></div></div>
     <span class="lbl">Quantos dados arriscar? Toque para escolher</span><div class="dice">${picks}</div>
     <button class="tog ${o.fis?"on":""}" data-act="rs" data-k="fis" data-v="${o.fis?"":"1"}"><span>Rolei dados físicos na mesa</span><span class="sw"></span></button>
     ${o.fis?`<div class="line"><div class="grow"><b>Quantos deram ${dif.d} ou mais?</b><span>Sucessos, contando os 6</span></div><div class="step"><button data-act="rs" data-k="fs" data-v="${Math.max(0,(o.fs||0)-1)}" aria-label="menos">−</button><b>${Math.min(o.fs||0,o.n)}</b><button data-act="rs" data-k="fs" data-v="${Math.min(o.n,(o.fs||0)+1)}" aria-label="mais">+</button></div></div>
     <div class="line"><div class="grow"><b>Quantos deram 6?</b></div><div class="step"><button data-act="rs" data-k="f6" data-v="${Math.max(0,(o.f6||0)-1)}" aria-label="menos">−</button><b>${Math.min(o.f6||0,o.fs||0)}</b><button data-act="rs" data-k="f6" data-v="${Math.min(o.fs||0,(o.f6||0)+1)}" aria-label="mais">+</button></div></div>`:""}
     ${o.tipo==="ajudar"?`<label class="lbl" for="alvoA">Ajudar quem</label><select id="alvoA" data-act-change="rsAlvo">${outros.map(([u,x])=>`<option value="${u}" ${o.alvo===u?"selected":""}>${esc(x.nome)} (${x.pilha} dados)</option>`).join("")}</select>`:""}
     <span class="lbl">Estilo da ação</span><div class="chips">${ordem.map(e=>`<button class="chip ${o.estilo===e?"on":""} ${A.est.includes(e)?"own":""}" data-act="rs" data-k="estilo" data-v="${o.estilo===e?"":e}">${e}${A.est.includes(e)?" −1":""}</button>`).join("")}</div>
     ${o.tipo==="teste"?`<button class="tog ${o.cx?"on":""}" data-act="rs" data-k="cx" data-v="${o.cx?"":"1"}"><span>Teste Complexo</span><span class="sw"></span></button>`:""}
     <button class="tog ${o.rec?"on":""}" data-act="rs" data-k="rec" data-v="${o.rec?"":"1"}" ${(s.recursos||0)<1?"disabled":""}><span>Usar um Recurso (−1) · tem ${s.recursos||0}</span><span class="sw"></span></button>
     <button class="btn primary xl block" data-act="doRoll" ${(o.tipo==="ajudar"&&!outros.length)||s.pilha<1?"disabled":""}>${ic("dice")} ${o.fis?"Aplicar resultado":"Rolar "+o.n}</button>`;
  }
  if(o.kind==="info"){
    const m=MANOBRAS.find(x=>x[0]===o.k);
    return `<div class="row between"><div class="row">${ic(m[1])}<h2>${m[2]}</h2></div><button class="btn ghost sm" data-act="closeSheet">Fechar</button></div>
     <p>${m[4]}</p><div class="note">${m[5]}</div>
     <button class="btn primary xl block" data-act="meu">Ajustar meus números</button>`;
  }
  if(o.kind==="meu"){
    const p=pools(); const enc=modo()==="encontro";
    const stp=(f,lab,max,sub)=>`<div class="line"><div class="grow"><b>${lab}</b>${sub?`<span>${sub}</span>`:""}</div><div class="step"><button data-act="sobStep" data-f="${f}" data-d="-1" data-max="${max}" aria-label="menos ${lab}">−</button><b>${s[f]||0}</b><button data-act="sobStep" data-f="${f}" data-d="1" data-max="${max}" aria-label="mais ${lab}">+</button></div></div>`;
    return `<div class="row between"><h2>Meus números</h2><button class="btn primary sm" data-act="closeSheet">Pronto</button></div>
     <span class="lbl">Dados · ${s.pilha}/6</span>${diceRow(s.pilha)}
     <div class="acts">
      <button class="act" data-act="meuDado" data-o="killer" ${s.pilha<1?"disabled":""}>${ic("mask")}<b>−1 para o Killer</b><span>Perdi fora do Encontro</span></button>
      <button class="act" data-act="meuDado" data-o="descarte" ${s.pilha<1?"disabled":""}>${ic("skull")}<b>−1 para o Descarte</b><span>Perdi no Encontro ou Susto</span></button>
      <button class="act" data-act="meuDado" data-o="recupera" ${s.pilha>=6||p.descarte<1?"disabled":""}>${ic("wind")}<b>+1 do Descarte</b><span>${p.descarte} no Descarte</span></button>
      <button class="act" data-act="meuDado" data-o="ganha" ${s.pilha>=6?"disabled":""}>${ic("plus")}<b>+1 dado</b><span>O Mestre me deu</span></button>
      ${enc?`<button class="act" data-act="meuDado" data-o="fuga" ${s.pilha<1?"disabled":""}>${ic("run")}<b>Mover para a Fuga</b><span>Fuga ${s.fuga||0}/${fugaAlvo()}</span></button>
      <button class="act" data-act="meuDado" data-o="volta" ${!(s.fuga>0)?"disabled":""}>${ic("dice")}<b>Voltar da Fuga</b><span>Para sua pilha</span></button>
      <button class="act" data-act="meuDado" data-o="forc">${ic("fist")}<b>Killer perde 1 dado</b><span>Acertei Partir pra Cima</span></button>`:""}
     </div>
     ${vivos().filter(([u])=>u!==S.uid).length?`<span class="lbl">Doar 1 dado para</span><div class="chips">${vivos().filter(([u])=>u!==S.uid).map(([u,x])=>`<button class="chip" data-act="doar" data-u="${u}" ${s.pilha<1||x.pilha>=6?"disabled":""}>${esc(x.nome)} · ${x.pilha}</button>`).join("")}</div>`:""}
     <div class="list">${stp("pt","Tensão (PT)",10)}${stp("ferida","Ferida",6,"Chegou a 6, morreu")}${stp("sequela","Sequela",5)}${stp("recursos","Recursos",9)}</div>
     <p class="tiny muted">Os botões de dados movem o dado para a pilha certa, então o Killer e o Descarte ficam sempre em dia.</p>`;
  }
  if(o.kind==="susto"){
    const r=o.res; if(!r) return "";
    return `<span class="lbl">Teste de Susto</span><div class="verdict ${r.v>=4?"ok":"no"}">${r.v>=4?"Firme":"Apavorada"}</div><div class="dice">${dieHTML(r.v,(r.v>=4?(r.v===6?"six":""):"fail")+" anim")}</div><div class="conseq"><div><span>${r.msg}</span></div></div>
      ${r.v<4&&r.podeRepetir?`<button class="btn block" data-act="sustoRepetir">Repetir (Benefício da Dúvida)</button>`:""}<button class="btn primary xl block" data-act="closeSheet">Ok</button>`;
  }
  if(o.kind==="tratar"){
    const max=Math.min(s.pt,s.ferida-s.sequela);
    return `<h2>Tratar Feridas</h2><p class="small muted">1 PT = −1 Ferida. Não desce abaixo de ${s.sequela} (suas Sequelas).</p>
     <div class="line"><div class="grow"><b>PT a gastar</b></div><div class="step"><button data-act="tsN" data-v="${Math.max(0,(o.n||0)-1)}">−</button><b>${o.n||0}</b><button data-act="tsN" data-v="${Math.min(max,(o.n||0)+1)}">+</button></div></div>
     <button class="btn primary block" data-act="tratarOk" ${!(o.n>0)?"disabled":""}>Tratar ${o.n||0} de Ferida</button>
     <button class="btn block" data-act="curarSeq" ${(s.recursos||0)<1||s.sequela<1?"disabled":""}>Curar 1 Sequela com um Recurso</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="compartilhar"){
    const outros=vivos().filter(([u])=>u!==S.uid);
    return `<h2>Compartilhar Forças</h2><select id="cpA" data-act-change="cpAlvo" aria-label="Para quem">${outros.map(([u,x])=>`<option value="${u}" ${o.alvo===u?"selected":""}>${esc(x.nome)} (${x.pt} PT)</option>`).join("")}</select>
     <div class="line"><div class="grow"><b>PT</b></div><div class="step"><button data-act="cpN" data-v="${Math.max(0,(o.n||0)-1)}">−</button><b>${o.n||0}</b><button data-act="cpN" data-v="${Math.min(s.pt,(o.n||0)+1)}">+</button></div></div>
     <button class="btn primary block" data-act="cpOk" ${!(o.n>0)||!o.alvo?"disabled":""}>Transferir</button><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="tomar"){
    return `<h2>Tomar Jeito</h2><p class="small muted">Qual Estilo destravar? (3 PT)</p><div class="list">${(s.incap||[]).map(e=>`<button class="btn" data-act="tomarOk" data-e="${e}">${e}</button>`).join("")}</div><button class="btn ghost block" data-act="closeSheet">Cancelar</button>`;
  }
  if(o.kind==="arriscar"){
    const outros=vivos().filter(([u,x])=>!escapou(x));
    return `<h2>Arriscar Tudo</h2><p class="small">Você descarta todos os seus dados e quem você escolher escapa na hora. Só 1 vez por sessão.</p>
     <div class="list">${outros.map(([u,x])=>`<button class="line" data-act="arPick" data-u="${u}" style="text-align:left;${o.alvo===u?"border-color:var(--blood);background:var(--blood-bg)":""}"><div class="grow"><b>${esc(x.nome)}${u===S.uid?" (você)":""}</b><span>${x.pilha} dados</span></div></button>`).join("")}</div>
     ${["Até o Fim","Sacrifício Heroico","Final Girl"].includes(s.hab)?`<p class="note">${esc(s.hab)} já é aplicada automaticamente.</p>`:""}
     <button class="btn primary xl block" data-act="arOk">${ic("flame")} Arriscar Tudo</button>`;
  }
  if(o.kind==="kAlvo"){
    const kp=pools().killer;
    const alvos=vivos().filter(([u,x])=>!escapou(x));
    const r=o.res;
    if(r) return `<span class="lbl">${o.a==="ferir"?"Ferir":"Matar"}</span>${r.v?`<div class="dice">${dieHTML(r.v,(r.v===6?"six":"")+" anim")}</div>`:""}<div class="conseq"><div><span>${r.msg}</span></div></div>
      ${r.mutilar?`<div class="acts"><button class="act k go" data-act="kSeis" data-o="matar">${ic("skull")}<b>Matar</b><span>Fim da linha</span></button><button class="act k" data-act="kSeis" data-o="mutilar">${ic("knife")}<b>Mutilar</b><span>+3 Sequelas · +4 PH</span></button></div>`:`<button class="btn primary xl block" data-act="closeSheet">Ok</button>`}`;
    return `<div class="row between"><h2>${o.a==="ferir"?"Ferir quem?":"Matar quem?"}</h2><button class="btn ghost sm" data-act="closeSheet">Fechar</button></div>
     ${o.a==="matar"?`<p class="small muted">Só quem tem menos dados que você (${kp}).</p>`:`<p class="small muted">Rola 1 dado seu: 6 mata ou mutila, 1 a 5 vira Ferida.</p>`}
     <div class="list">${alvos.map(([u,x])=>{const pode=o.a==="ferir"||x.pilha<kp;return `<button class="line" data-act="kGo" data-u="${u}" ${pode?"":"disabled"} style="text-align:left;${pode?"":"opacity:.4"}"><div class="grow"><b>${esc(x.nome)}</b><div class="row" style="gap:6px;margin-top:4px">${mini(x.pilha)}<span class="tiny" style="color:#ff6b7f">ferida ${x.ferida}</span></div></div></button>`}).join("")||`<p class="muted">Ninguém ao alcance.</p>`}</div>`;
  }
  if(o.kind==="kUnica"){
    const A=ACOES_U[o.a]; const alvos=vivos();
    return `<div class="row between"><h2>${o.a}</h2><button class="btn ghost sm" data-act="closeSheet">Fechar</button></div><p class="small">${A.d}</p>
     ${(A.marc||A.incap)?`<span class="lbl">Em quem</span><div class="list">${alvos.map(([u,x])=>`<button class="line" data-act="kuAlvo" data-u="${u}" style="${o.alvo===u?"border-color:var(--killer);background:var(--killer-bg)":""}"><div class="grow"><b>${esc(x.nome)}</b></div></button>`).join("")}</div>`:""}
     ${A.incap&&o.alvo?`<span class="lbl">Qual Estilo</span><div class="chips">${ESTILOS.map(e=>`<button class="chip ${o.est===e?"on":""}" data-act="kuEst" data-e="${e}">${e}</button>`).join("")}</div>`:""}
     <button class="btn killer xl block" data-act="kuOk" ${((A.marc||A.incap)&&!o.alvo)||(A.incap&&!o.est)?"disabled":""}>Usar${A.c?` · ${A.c} PH`:""}</button>`;
  }
  if(o.kind==="editSob"){
    const x=S.sobrev[o.u]; if(!x) return `<button class="btn block" data-act="closeSheet">Fechar</button>`;
    const st=(f,lab,max)=>`<div class="line"><div class="grow"><b>${lab}</b></div><div class="step"><button data-act="mStep" data-u="${o.u}" data-f="${f}" data-d="-1" data-max="${max}" aria-label="menos">−</button><b>${f.includes(".")?(x.marc?.[f.split(".")[1]]||0):(x[f]||0)}</b><button data-act="mStep" data-u="${o.u}" data-f="${f}" data-d="1" data-max="${max}" aria-label="mais">+</button></div></div>`;
    return `<div class="row between"><h2>${esc(x.nome)}</h2><button class="btn primary sm" data-act="closeSheet">Pronto</button></div>

     <details><summary>Marcadores e Estilos</summary><div class="in"><div class="list">${Object.keys(MARC_N).map(k=>st("marc."+k,MARC_N[k],6)).join("")}</div>
      <span class="lbl">Estilos travados</span><div class="chips">${ESTILOS.map(e=>`<button class="chip ${(x.incap||[]).includes(e)?"on":""}" data-act="mIncap" data-u="${o.u}" data-e="${e}">${e}</button>`).join("")}</div></div></details>
     <p class="tiny muted">Ajustes aqui não mexem nas pilhas do Killer nem do Descarte.</p>
     <button class="btn block" data-act="mStatus" data-u="${o.u}">${x.status==="morto"?"Reviver":"Marcar como morta"}</button>`;
  }
  return "";
}
function calcDif(o){
  const s=me(),A=ARQ[s.arq]; let d=4, cx=!!o.cx; const notes=[];
  if(o.estilo&&A.est.includes(o.estilo)&&!(s.incap||[]).includes(o.estilo)) d--;
  if(o.rec) d--;
  const amP=S.killer?.amP;
  if(o.tipo==="partir"&&amP==="Máquina"){d++;notes.push("Além da Carne +1")}
  if(o.tipo==="partir"&&amP==="Desconhecido"){cx=true;notes.push("Não Euclidiano")}
  if(o.tipo==="vazar"&&amP==="Perseguidor"&&s.ferida>3){d++;notes.push("Rastro de Sangue +1")}
  if(o.tipo==="distrair") cx=true;
  if((s.marc?.condenacao||0)>0){cx=true;notes.push("Condenação")}
  return {d:clamp(d,2,6),cx,notes};
}

async function doRoll(){
  const o=S.sheet,s=me(); const n=Math.min(o.n,s.pilha); if(n<1)return;
  const {d,cx}=calcDif(o); let dice=roll(n);
  if(o.fis){const fs=Math.min(o.fs||0,n),f6=Math.min(o.f6||0,fs);dice=[...Array(f6).fill(6),...Array(fs-f6).fill(Math.min(5,d)),...Array(n-fs).fill(Math.max(1,d-1))];}
  let succ=dice.filter(v=>v>=d).length; const sixes=dice.filter(v=>v===6).length;
  const msgs=[]; const patch={}; const enc=modo()==="encontro";
  if(o.tipo==="partir"&&s.flags?.aquecer){succ++;patch.flags={...s.flags,aquecer:false};msgs.push("Aquecer: +1 sucesso garantido.")}
  const ok=cx?(succ>=2||sixes>0&&succ>=1):succ>=1;
  const fails=n-Math.min(succ,n);
  if(o.rec){patch.recursos=s.recursos-1;msgs.push("1 Recurso usado.")}
  let pilha=s.pilha;
  const perder=(q)=>{ if(q<=0)return; pilha-=q;
    if(enc){patch.desc=(s.desc||0)+q;msgs.push(`${q} ${q>1?"dados foram":"dado foi"} para o <b>Descarte</b>.`)}
    else {patch.sac=(s.sac||0)+q;msgs.push(`${q} ${q>1?"dados foram":"dado foi"} para <b>${esc(S.killer?.nome||"o Killer")}</b>${S.mesa.killer?` (${esc(nick(S.mesa.killer))})`:""}.`)}
    if((s.marc?.possessao||0)>0){const pv=Math.min(6,s.marc.possessao+q);patch.marc={...s.marc,possessao:pv};msgs.push(`Possessão subiu para ${pv}.`);if(pv>=6)log(`👁 A Possessão de ${s.nome} chegou a 6!`,"k")}
  };
  if(o.tipo==="teste"){
    perder(fails);
    let extra=Math.max(0,succ-(cx?2:1));
    if(s.hab==="Egocêntrica"&&sixes){extra+=2*sixes;msgs.push(`Egocêntrica: +${2*sixes} PT pelos 6.`)}
    if(extra){patch.pt=clamp(s.pt+extra,0,10);msgs.push(`<b>+${extra} PT</b> pelos sucessos extras.`)}
    log(`${s.nome} rolou ${n} (${dice.join(", ")}) ${o.estilo||""}: ${ok?"sucesso":"falha"}.`);
  } else if(o.tipo==="vazar"){
    let fuga=s.fuga||0; pilha-=n; fuga+=Math.min(succ,n); if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} ${fails>1?"dados foram":"dado foi"} para o <b>Descarte</b>.`)}
    let extraRec=0,extra=0; for(let i=0;i<sixes;i++){ if(pilha>0){pilha--;fuga++;extra++} else if(pools().descarte-extraRec>0){extraRec++;fuga++;extra++} }
    if(sixes)msgs.push(extra?`Fuga vantajosa: +${extra} dado(s) extra para a Fuga.`:`Fuga vantajosa, mas não havia dado na Pilha nem no Descarte para puxar.`);
    if(extraRec)patch.rec=(s.rec||0)+extraRec;
    patch.fuga=fuga; msgs.push(`Fuga: ${fuga}/${fugaAlvo()}.`);
    if(fuga>=fugaAlvo()){patch.escEnc=encId();msgs.push("<b>Você escapou do Encontro!</b>");log(`🏃 ${s.nome} escapou do Encontro!`)}
    else log(`${s.nome} tentou vazar dali: Fuga ${fuga}/${fugaAlvo()}.`);
  } else if(o.tipo==="partir"){
    pilha-=fails; if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} ${fails>1?"dados foram":"dado foi"} para o <b>Descarte</b>.`)}
    if(ok){patch.forc=(s.forc||0)+1;msgs.push("O Killer descarta 1 dado!");log(`💥 ${s.nome} partiu pra cima: o Killer perdeu 1 dado.`,"d")}
    else log(`${s.nome} partiu pra cima e não conseguiu nada.`);
  } else if(o.tipo==="distrair"){
    pilha-=fails; if(fails){patch.desc=(s.desc||0)+fails;msgs.push(`${fails} ${fails>1?"dados foram":"dado foi"} para o <b>Descarte</b>.`)}
    if(ok){patch.distr=(s.distr||0)+1;msgs.push("Distraído! Matar agora custa +1 dado e 3 PH.");log(`${s.nome} distraiu o Killer.`)}
  } else if(o.tipo==="ajudar"){
    const t=S.sobrev[o.alvo]; const give=Math.min(succ,n,6-t.pilha);
    pilha-=give; if(give){await upd(P.sob(S.code,o.alvo),{pilha:t.pilha+give});}
    msgs.push(`${give} dado(s) doado(s) para ${esc(t.nome)}. Falhas não se perdem.`); log(`${s.nome} ajudou ${t.nome} com ${give} dado(s).`);
  }
  patch.pilha=pilha;
  await upd(P.sob(S.code,S.uid),patch);
  o.res={dice,diff:d,succ:Math.min(succ,n+1),ok,cx,msgs}; renderSheet();
}
async function doSusto(repetindo){
  const s=me(); const m=S.mesa;
  if(s.pilha<1){await upd(P.sob(S.code,S.uid),{sustoId:m.susto.id});openSheet({kind:"susto",res:{v:1,msg:"Sem dados para rolar.",podeRepetir:false}});return}
  const v=d6(); const patch={sustoId:m.susto.id}; let msg=""; let pilha=s.pilha;
  if(repetindo){ // devolve o dado perdido na rolagem anterior
    const prev=S.sheet?.res; if(prev&&prev.v<4){ if(prev.sac)patch.sac=(s.sac||0)-1; else patch.desc=(s.desc||0)-1; pilha++; }
  }
  if(v<4){patch.pilha=pilha-1; if(m.susto.sac){patch.sac=(patch.sac??s.sac??0)+1;msg="O dado foi sacrificado para o Killer."} else {patch.desc=(patch.desc??s.desc??0)+1;msg="O dado foi para o Descarte."}
    log(`😱 ${s.nome} falhou no Susto (${v}).`,"d")} else {msg="Nenhum dado perdido.";patch.pilha=pilha;log(`${s.nome} segurou o Susto (${v}).`)}
  await upd(P.sob(S.code,S.uid),patch);
  openSheet({kind:"susto",res:{v,msg,sac:m.susto.sac,podeRepetir:!repetindo&&s.hab==="Benefício da Dúvida"}});
}
async function vantagem(id){
  const s=me(),v=VANT[id]; const cost=id==="choque"&&s.hab?.startsWith("Tensão Aliviada")?5:v.c;
  if(id==="tratar") return openSheet({kind:"tratar",n:0});
  if(id==="compartilhar"){const o=vivos().filter(([u])=>u!==S.uid);return openSheet({kind:"compartilhar",n:0,alvo:o[0]?.[0]})}
  if(id==="tomar"){if(!(s.incap||[]).length)return toast("Nenhum Estilo incapacitado.");return openSheet({kind:"tomar"})}
  if(s.pt<cost) return toast("PT insuficiente.");
  const patch={pt:s.pt-cost};
  if(id==="choque"){if(pools().descarte<1)return toast("O Descarte está vazio.");if(s.pilha>=6)return toast("Pilha cheia.");patch.pilha=s.pilha+1;patch.rec=(s.rec||0)+1}
  if(id==="cacar") patch.recursos=(s.recursos||0)+1;
  if(id==="aquecer") patch.flags={...(s.flags||{}),aquecer:true};
  if(id==="planejar") patch.flags={...(s.flags||{}),planejar:true};
  if(id==="preparar") patch.flags={...(s.flags||{}),preparar:true};
  await upd(P.sob(S.code,S.uid),patch); log(`${s.nome} usou ${v.n}.`); toast(v.n);
}
async function arriscarTudo(){
  const s=me(),o=S.sheet,alvo=o.alvo||S.uid,t=S.sobrev[alvo];
  const naCena=vivos().filter(([u,x])=>!escapou(x));
  let manter=0; if(alvo===S.uid&&s.hab==="Até o Fim")manter=1;
  let perde=s.pilha+(s.fuga||0)-manter;
  if(alvo!==S.uid&&s.hab==="Sacrifício Heroico")perde=Math.ceil(perde/2);
  if(s.hab==="Final Girl"&&naCena.length===1)perde=0;
  const patch={pilha:s.pilha+(s.fuga||0)-perde,fuga:0,desc:(s.desc||0)+perde,arriscouSessao:S.mesa.sessao||1};
  if(alvo===S.uid)patch.escEnc=encId();
  await upd(P.sob(S.code,S.uid),patch);
  if(alvo!==S.uid) await upd(P.sob(S.code,alvo),{escEnc:encId()});
  log(`🔥 ${s.nome} arriscou tudo: ${t.nome} escapou! (${perde} dado(s) descartado(s))`,"d"); closeSheet();
}
async function killerGo(u){
  const o=S.sheet,k=S.killer,t=S.sobrev[u];o.u=u;
  if(o.a==="matar"){
    const distr=Object.values(S.sobrev).reduce((a,s)=>a+(s.encId===encId()?(s.distr||0):0),0);
    let custo=2+distr; if(k.apavoro==="Já Sofreu o Suficiente!"&&t.pilha<3)custo=1+distr; const ph=3*distr;
    if(pools().killer<custo) {o.res={msg:`Precisa de ${custo} dados.`};return renderSheet()}
    if(k.ph<ph){o.res={msg:`As Distrações exigem ${ph} PH.`};return renderSheet()}
    await upd(P.killer(S.code),{base:(k.base||0)-custo,desc:(k.desc||0)+custo,ph:k.ph-ph});
    await upd(P.sob(S.code,u),{status:"morto"}); log(`☠ ${k.nome} matou ${t.nome}.`,"d");
    o.res={msg:`${esc(t.nome)} está morta. ${custo} dado(s) foram para o Descarte.`};return renderSheet();
  }
  // ferir
  if(pools().killer<1){o.res={msg:"Sem dados para Ferir."};return renderSheet()}
  const v=d6(); o.v=v;
  if(v===6){o.res={v,msg:`Tirou 6 em ${esc(t.nome)}. Matar ou Mutilar?`,mutilar:true};return renderSheet()}
  let val=v; const extras=[];
  if(t.flags?.preparar){val=Math.max(0,val-1);extras.push("Preparada para o Pior: −1")}
  if(k.amP==="Brutamontes"&&t.sequela>0){val++;extras.push("Banho de Sangue: +1")}
  const fer=t.ferida+val, seq=Math.min(5,t.sequela+1);
  const patch={ferida:Math.min(6,fer),sequela:seq,flags:{...(t.flags||{}),preparar:false}};
  if(fer>=6)patch.status="morto";
  await upd(P.killer(S.code),{base:(k.base||0)-1});
  await upd(P.sob(S.code,u),patch);
  log(fer>=6?`☠ ${k.nome} feriu ${t.nome} até a morte (${v}).`:`🩸 ${k.nome} feriu ${t.nome}: Ferida ${fer}, Sequela ${seq}.`,"d");
  o.res={v,msg:`${esc(t.nome)}: Ferida ${Math.min(6,fer)}, Sequela ${seq}${extras.length?" ("+extras.join(", ")+")":""}.${fer>=6?" <b>Morreu.</b>":""} O dado virou o Dado Marcador dela.`};renderSheet();
}
async function killerSeis(op){
  const o=S.sheet,k=S.killer,t=S.sobrev[o.u];
  await upd(P.killer(S.code),{base:(k.base||0)-1,desc:(k.desc||0)+1,ph:k.ph+(op==="mutilar"?4:0)});
  if(op==="matar"){await upd(P.sob(S.code,o.u),{status:"morto"});log(`☠ ${k.nome} matou ${t.nome} com um 6.`,"d");o.res={v:6,msg:`${esc(t.nome)} morreu.`}}
  else{const seq=Math.min(5,t.sequela+3);await upd(P.sob(S.code,o.u),{sequela:seq,ferida:Math.max(t.ferida,seq)});log(`🪓 ${k.nome} mutilou ${t.nome}: +3 Sequelas. Uma última chance de correr…`,"d");o.res={v:6,msg:`${esc(t.nome)} foi mutilada (Sequela ${seq}). +4 PH.`}}
  renderSheet();
}
async function killerUnica(){
  const o=S.sheet,k=S.killer,A=ACOES_U[o.a];
  const patch={ph:k.ph-A.c+(A.ph||0)}; await upd(P.killer(S.code),patch);
  if(A.marc&&o.alvo){const t=S.sobrev[o.alvo];let v=A.marc[1];if(k.amP==="Amaldiçoado")v++;await upd(P.sob(S.code,o.alvo),{marc:{...(t.marc||{}),[A.marc[0]]:Math.min(6,v)}});log(`${k.nome} usou ${o.a} em ${t.nome}.`,"k")}
  else if(A.incap&&o.alvo){const t=S.sobrev[o.alvo];const l=t.incap||[];await upd(P.sob(S.code,o.alvo),{incap:l.includes(o.est)?l:[...l,o.est]});log(`${k.nome} incapacitou ${o.est} de ${t.nome}.`,"k")}
  else log(`${k.nome} usou ${o.a}.`,"k");
  closeSheet();
}
